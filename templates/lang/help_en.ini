; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is enclosed in double quotes and contains none itself; markup
; stays raw, the help is not output escaped.

[HILFE]
K01 = "Audi Connect"
K02 = "Connects Audi vehicles to Loxone through the myAudi account: state of charge, fuel level, range, odometer, locking, doors and windows (including <i>which</i> ones are open), lights, vehicle state, climatisation including zones, window heating, charging values, battery temperature, location as well as inspection and oil service due dates. On request the climatisation, the charging session, the charge limit, the charging current, the window heating and nine vehicle options can be switched — and, to be released separately, locking and unlocking, horn and headlight flash."
K03 = "It works with every connected Audi: e-tron, hybrids and combustion vehicles. On a combustion vehicle the electric values stay empty; on a plug-in hybrid the plugin carries both drives separately."
K04 = "The caveat for this version"
K05 = "The plugin builds on two libraries of <b>different origin</b>:"
K06 = "<i>carconnectivity</i> — the framework, by Till Steinbach, maintained for years, version 0.11.10"
K07 = "<i>carconnectivity-connector-audi</i> — the Audi part, built on this framework by Achim Fischer. First version 28.09.2025, currently 0.3.2, eight releases in total"
K08 = "For comparison: the Volkswagen connector of the same framework is at 0.10.6. Technically the Audi part is largely the same — the same command classes, the same lower limit of 180&nbsp;seconds. It is only younger and less proven. That is why <b>both</b> versions are pinned here: a silent update could change more than elsewhere."
K09 = "Two limits"
K10 = "<b>Europe.</b> The connector talks to the European service."
K11 = "<b>Two-factor confirmation.</b> Some accounts require it when signing in. This cannot be automated; whoever is affected signs in once in a browser on the same device."
K12 = "Fetch interval: at least 180 seconds"
K13 = "This is not a precaution of this plugin but the library's lower limit — below that it does not even accept the setting. Five minutes are a good start. If a value is needed immediately, the fetch command is the right way, not a shorter interval."
K14 = "Credentials"
K15 = "These are the credentials of the <b>myAudi account</b> — the same as in the myAudi app. They live in a separate file with permissions 0600 and never appear in the Loxone project file. The password is displayed nowhere; the <i>Test</i> tab only shows its length. The S-PIN is used exclusively for locking and unlocking."
K16 = "After the first sign-in the library stores authentication tokens and signs in with them instead of sending the password every time. After a password change they are worthless — for that the <i>Settings</i> tab has the button <i>Force new sign-in</i>. If Audi rejects the sign-in five times in a row, the service stops signing in and reports <i>sign-in rejected, check credentials</i> until e-mail or password are changed – so Audi does not lock the account."
K17 = "How to proceed"
K18 = "<b>Settings:</b> enter user name and password, save, then <i>Start service</i>."
K19 = "<b>Test:</b> the self-check tells you line by line whether it holds. Every cross names the remedy. A grey dot is a note, not a defect."
K20 = "<b>MQTT:</b> the plugin brings its subscription along in the file <i>mqtt_subscriptions.cfg</i>; MQTT gateway&nbsp;V1 reads it, and it follows the prefix as soon as that is saved. If nothing arrives at the Miniserver all the same, additionally enter the subscription in the MQTT gateway. From version&nbsp;2 on the topic group appears by itself under Subscriptions."
K21 = "<b>Loxone integration:</b> step by step, with ready-made import files for every request and for the commands — and with four pages from the sample project (monitoring, charging, climate and commands, vehicle) including pictures and instructions for rebuilding."
K22 = "Control — two checkboxes, not one"
K23 = "Writing commands are <b>blocked</b> by default. Locking and unlocking, horn and headlight flash hang on a <b>second</b> checkbox that has to be ticked in addition: they act on a vehicle standing in a public place, and neither has been tried on an actual vehicle. To check the chain without touching the car, tick the <i>dry run</i> — every command is then checked completely and nothing is sent. Important: an answer of <i>OK=1</i> means the Audi server accepted the job — whether the vehicle carries it out only shows on the next fetch."
K24 = "What is unverified"
K25 = "This plugin was built without a myAudi account and without a vehicle. Unverified is therefore whether the sign-in succeeds, whether a given vehicle supplies all the values queried and whether the writing commands have the expected effect. The mapping of the values and the commands, by contrast, are measured against the source of the pinned library version. If a value stays empty, the button <i>View raw data as JSON</i> in the <i>Test</i> tab shows what the service actually received."
K26 = "Basis"
K27 = "The connection uses <i>carconnectivity</i> by Till Steinbach and <i>carconnectivity-connector-audi</i> by Achim Fischer (both MIT). They are not an official Audi interface and may change at any time."
K28 = "Seven values that stay empty permanently"
K29 = "Measured against the source of the Audi connector 0.3.2 — not assumed: it never fills <b>licence plate, model year, software level, parking brake, battery capacity and oil level</b>. (Up to 0.9.11 the <i>manufacturer</i> was listed here as well — it does fill that one.) The library's core model knows these fields, the Audi part does not serve them. The plugin still queries them — a later connector version may supply them — and marks them everywhere as <i>stays empty</i> instead of sending an invented number. The battery capacity can be entered by hand in the <i>Settings</i> tab; it is needed for consumption and charged amount."
K30 = "Throttling — the protection of your account"
K31 = "Audi throttles an account that sends too many requests and, in the worst case, blocks it for 24 hours. Three brakes prevent that: a minimum gap for immediate fetches, an upper limit for switching commands per hour and a debounce for changes of the charging current. The last one matters for surplus charging — a controller in Loxone delivers a new set point every few seconds, and each one would be a request. Rejection always comes <b>with a reason</b>; a silently dropped command only makes people press again. In addition, the same set point – climatisation, charging, locking and unlocking, window heating, target temperature, charge limit, vehicle settings – goes to Audi only once within 60&nbsp;seconds; a second identical call gets <i>UNVERAENDERT=1</i>, and nothing is sent."
K32 = "Automation: pre-conditioning and charging recommendation"
K33 = "If the plugin <i>Abfahrtsassistent</i> runs on the same LoxBerry, Audi Connect can start the climatisation by itself — as many minutes before departure as configured. And from any foreign MQTT topic — for instance the exchange electricity price or a PV surplus — the plugin forms a charging recommendation that goes to Loxone as a number. <b>The decision is made in Loxone</b>, not here: everything else is there too. Both are off by default and need the Python module paho-mqtt. The installation fetches it <b>if an internet connection exists</b> — if that fails the plugin still runs, and only these two extra functions stay without effect. The <i>Test</i> tab says whether the module is there. The topic of the charging recommendation consists of letters, digits, dot, hyphen and underscore, levels separated by one slash – wildcards such as + or # do not work, exactly one value is needed."
K34 = "Computed values and the charging log"
K36 = "What OK says"
K37 = "<b>OK=1</b> means: the image is valid, i.e. at most three times as old as the cycle. If it is older – the service is stopped, hanging or has not reached Audi for a long time – the endpoint reports <b>OK=0</b>; ALTER stands unchanged next to it, and GRUND names the cause (10 = image too old). A single failed fetch does not set OK to 0: the image is still usable then, and GRUND says what went wrong."
K38 = "MQTT: retained and sign of life"
K39 = "The states of the vehicle – locking, doors, windows, charging cable, charge limit, model, odometer and the others marked <i>retained</i> in the <i>MQTT</i> tab – go out <b>retained</b>, so that Loxone has them right after a restart. Measured values tied to time, position, completion times and the statements of the service about itself never do. A state without a statement goes out as <i>-</i>. <i>status/ts</i> and <i>status/zaehler</i> are the sign of life, with every pass. When the prefix changes, when MQTT is switched off, for a removed vehicle and on uninstalling, the plugin clears its retained topics at the broker."
K35 = "From existing values the plugin computes further ones without asking Audi for anything extra: <i>at home</i> and the distance to it from a stored home position, the consumption of the last driving leg and the charged amount from the stored battery capacity, the standing time and the number of consecutive failures. Every completed charging session is additionally logged and appears in its own <i>Charging sessions</i> tab. <b>If an ingredient is missing, no value is produced</b> — and certainly not a 0."
K40 = "Gateway V2 and commands via MQTT (since 0.9.30)"
K41 = "With <b>MQTT gateway V2</b> only what is ticked in the <i>Subscriptions</i> reaches the Miniserver; the list is in the <i>MQTT</i> tab and the <i>Test</i> tab checks it. Commands from Loxone go through the <b>command bridge</b> (<i>audi/befehl/&lt;name&gt;</i>, answer under <i>…/quittung</i>) into the same queue as the HTTP path. Everything is off by default; the UDP input of the gateway accepts messages in the home network without login, so intervening commands need a tick of their own. The HTTP endpoint can be switched off (off for new installations, on after an update)."
K42 = "House topics: departure, presence, electricity price (since 0.9.30)"
K43 = "The plugin can read values of other plugins: the minutes until departure (<i>haus/abfahrt</i>, departure assistant), presence (<i>haus/anwesenheit</i>, BLE Scanner NG) and the electricity price (<i>haus/strompreis</i>, spot price plugin). A value counts only while the counter of its source changes within 120 seconds; if it is silent, the previous behaviour applies and the <i>Test</i> tab says so. Pre-conditioning triggers at most twice per departure and counts as done only once Audi accepted the command. Charging cost is produced only for charges at home and never estimated."
K44 = "Messages to SignalBot (since 0.9.30)"
K45 = "Charging finished or stopped, vehicle left open, no more data and a failed pre-conditioning can be passed to SignalBot – off by default, each event can be deselected. The sample project sends the same messages from Loxone as well; switch on only one path."
K46 = "<b>Several speakers at once</b> (since 0.9.30, speech module 1.2.1): below the output type (now “target 1”) the table <i>Further outputs (simultaneous)</i> takes up to 6 targets in total, for example Loxone Music Server, Google speakers (Chromecast 4 Lox NG) and Amazon Echo (Alexa-NG). Every announcement goes to target 1 and to every enabled target of the table at the same time; if one fails the others still speak, and the announcement counts as sent as soon as one has spoken (the log and the Test tab name every target). If target 1 is off, none speaks; the original Audio Server as target 1 cannot be combined with further targets. New target: fill in the empty row and save. Several zones of the same Music Server or several Echos belong in ONE target (zone list, comma list, gruppe:&lt;name&gt;). The speech token is entered once above and applies to all targets of that kind. In the Test tab <i>Test announcement</i> speaks to all targets, <i>Test announcement to target n</i> only to that one. Before going back to a version older than 0.9.30 remove the further targets – older versions do not know the list and would fall back to the factory settings of the speech output. <b>Collective topics and cable:</b> Tab <i>MQTT</i> switches <span style='font-family:monospace'>haus/fahrzeug/&lt;name&gt;/…</span> (on by default). The cable warning and the minimum battery for pre-conditioning are with the pre-conditioning settings; unknown values never warn and never block."
