; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is enclosed in double quotes and contains none itself; markup
; stays raw, the help is not output escaped.

[HILFE]
K01 = "Audi Connect"
K02 = "Connects Audi vehicles to Loxone through the myAudi account: state of charge, fuel level, range, odometer, locking, doors and windows (including <i>which</i> ones are open), lights, vehicle state, climatisation including zones, window heating, charging values, battery temperature, location as well as inspection and oil service due dates. On request the climatisation, the charging session, the charge limit, the charging current, the window heating and nine vehicle options can be switched — and, to be released separately, locking and unlocking, horn and headlight flash."
K03 = "It works with every connected Audi: e-tron, hybrids and combustion vehicles. On a combustion vehicle the electric values stay empty; on a plug-in hybrid the plugin carries both drives separately."
K04 = "The caveat for this version"
K05 = "The plugin builds on two libraries of <b>different origin</b>:"
K06 = "<i>carconnectivity</i> — the framework, by Till Steinbach, maintained for years, version 0.11.10"
K07 = "<i>carconnectivity-connector-audi</i> — the Audi part, built on this framework by Achim Fischer. First version 28.09.2025, currently 0.3.2, eight releases in total"
K08 = "For comparison: the Volkswagen connector of the same framework is at 0.10.6. Technically the Audi part is largely the same — the same command classes, the same lower limit of 180&nbsp;seconds. It is only younger and less proven. That is why <b>both</b> versions are pinned here: a silent update could change more than elsewhere."
K09 = "Two limits"
K10 = "<b>Europe.</b> The connector talks to the European service."
K11 = "<b>Two-factor confirmation.</b> Some accounts require it when signing in. This cannot be automated; whoever is affected signs in once in a browser on the same device."
K12 = "Fetch interval: at least 180 seconds"
K13 = "This is not a precaution of this plugin but the library's lower limit — below that it does not even accept the setting. Five minutes are a good start. If a value is needed immediately, the fetch command is the right way, not a shorter interval."
K14 = "Credentials"
K15 = "These are the credentials of the <b>myAudi account</b> — the same as in the myAudi app. They live in a separate file with permissions 0600 and never appear in the Loxone project file. The password is displayed nowhere; the <i>Test</i> tab only shows its length. The S-PIN is used exclusively for locking and unlocking."
K16 = "After the first sign-in the library stores authentication tokens and signs in with them instead of sending the password every time. After a password change they are worthless — for that the <i>Settings</i> tab has the button <i>Force new sign-in</i>."
K17 = "How to proceed"
K18 = "<b>Settings:</b> enter user name and password, save, then <i>Start service</i>."
K19 = "<b>Test:</b> the self-check tells you line by line whether it holds. Every cross names the remedy. A grey dot is a note, not a defect."
K20 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver."
K21 = "<b>Loxone integration:</b> step by step, with ready-made import files for every request and for the commands — and with a complete block list for rebuilding."
K22 = "Control — two checkboxes, not one"
K23 = "Writing commands are <b>blocked</b> by default. Locking and unlocking, horn and headlight flash hang on a <b>second</b> checkbox that has to be ticked in addition: they act on a vehicle standing in a public place, and neither has been tried on an actual vehicle. To check the chain without touching the car, tick the <i>dry run</i> — every command is then checked completely and nothing is sent. Important: an answer of <i>OK=1</i> means the Audi server accepted the job — whether the vehicle carries it out only shows on the next fetch."
K24 = "What is unverified"
K25 = "This plugin was built without a myAudi account and without a vehicle. Unverified is therefore whether the sign-in succeeds, whether a given vehicle supplies all the values queried and whether the writing commands have the expected effect. The mapping of the values and the commands, by contrast, are measured against the source of the pinned library version. If a value stays empty, the button <i>View raw data as JSON</i> in the <i>Test</i> tab shows what the service actually received."
K26 = "Basis"
K27 = "The connection uses <i>carconnectivity</i> by Till Steinbach and <i>carconnectivity-connector-audi</i> by Achim Fischer (both MIT). They are not an official Audi interface and may change at any time."
K28 = "Seven values that stay empty permanently"
K29 = "Measured against the source of the Audi connector 0.3.2 — not assumed: it never fills <b>licence plate, model year, manufacturer, software level, parking brake, battery capacity and oil level</b>. The library's core model knows these fields, the Audi part does not serve them. The plugin still queries them — a later connector version may supply them — and marks them everywhere as <i>stays empty</i> instead of sending an invented number. The battery capacity can be entered by hand in the <i>Settings</i> tab; it is needed for consumption and charged amount."
K30 = "Throttling — the protection of your account"
K31 = "Audi throttles an account that sends too many requests and, in the worst case, blocks it for 24 hours. Three brakes prevent that: a minimum gap for immediate fetches, an upper limit for switching commands per hour and a debounce for changes of the charging current. The last one matters for surplus charging — a controller in Loxone delivers a new set point every few seconds, and each one would be a request. Rejection always comes <b>with a reason</b>; a silently dropped command only makes people press again."
K32 = "Automation: pre-conditioning and charging recommendation"
K33 = "If the plugin <i>Abfahrtsassistent</i> runs on the same LoxBerry, Audi Connect can start the climatisation by itself — as many minutes before departure as configured. And from any foreign MQTT topic — for instance the exchange electricity price or a PV surplus — the plugin forms a charging recommendation that goes to Loxone as a number. <b>The decision is made in Loxone</b>, not here: everything else is there too. Both are off by default and need the Python module paho-mqtt, which the installation brings along."
K34 = "Computed values and the charging log"
K35 = "From existing values the plugin computes further ones without asking Audi for anything extra: <i>at home</i> and the distance to it from a stored home position, the consumption of the last driving leg and the charged amount from the stored battery capacity, the standing time and the number of consecutive failures. Every completed charging session is additionally logged and appears in its own <i>Charging sessions</i> tab. <b>If an ingredient is missing, no value is produced</b> — and certainly not a 0."
