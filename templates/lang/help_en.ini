; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Audi Connect"
K02 = "Connects Audi vehicles to Loxone through the myAudi account: state of charge, fuel level, range, odometer, locking, doors and windows, lights, handbrake, vehicle state, climate control, window heating, charging values, location and the inspection and oil service intervals. Climate control, charging, charge limit, charging current and window heating can be switched if you wish."
K03 = "It works with every connected Audi: e-tron, hybrids and combustion models. On a combustion car the electric values stay empty; on a plug-in hybrid the plugin carries both drives."
K04 = "The caveat about this version"
K05 = "The plugin builds on two libraries of <b>different provenance</b>:"
K06 = "<i>carconnectivity</i> — the framework, by Till Steinbach, maintained for years, version 0.11.10"
K07 = "<i>carconnectivity-connector-audi</i> — the Audi part, built on that framework by Achim Fischer. First release 28.09.2025, currently 0.3.2, eight releases in total"
K08 = "For comparison: the Volkswagen connector of the same framework stands at 0.10.6. Technically the Audi part is built the same way — the same command classes, the same values, the same lower limit of 180&nbsp;seconds. It is simply younger and less proven. That is why <b>both</b> versions are pinned here: a silent update could change more than it would elsewhere."
K09 = "Two limits"
K10 = "<b>Europe.</b> The connector talks to the European service."
K11 = "<b>Two-factor confirmation.</b> Some accounts demand it at login. That cannot be automated; anyone affected signs in once in a browser on the same device."
K12 = "Polling interval: at least 180 seconds"
K13 = "That is not caution on this plugin's part but the lower limit of the library — below that it will not even accept the setting. Five minutes is a good starting point. If a value is needed immediately, the fetch command is the right way, not a shorter interval."
K14 = "Credentials"
K15 = "These are the credentials of the <b>myAudi account</b> — the same ones as in the myAudi app. They are kept in a file of their own with permissions 0600 and never appear in the Loxone project file. The password is never displayed; the <i>Test</i> tab only shows its length."
K16 = "After the first login the library stores tokens and signs in with those instead of sending the password every time. After a password change they are worthless — for that the <i>Settings</i> tab has the button <i>Force new login</i>."
K17 = "How to proceed"
K18 = "<b>Settings:</b> enter user name and password, save, then <i>Start service</i>."
K19 = "<b>Test:</b> the self-check tells you line by line whether it holds. Every failed line names the remedy."
K20 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver."
K21 = "<b>Loxone integration:</b> step by step, with a complete list of blocks to rebuild it."
K22 = "Control"
K23 = "Writing commands are <b>locked</b> by default and have to be released explicitly. Locking and unlocking as well as the horn and headlight flash are deliberately <b>not</b> offered by this plugin. Important: a reply of <i>OK=1</i> means the Audi server has accepted the job — whether the vehicle carries it out only shows on the next fetch."
K24 = "What has not been tested"
K25 = "This plugin was built without a myAudi account and without a vehicle. What is untested is therefore whether the login succeeds, whether a given vehicle supplies all the values queried and whether the writing commands have the expected effect. The mapping of the values themselves, by contrast, was measured against real objects of the library. If a value stays empty, the <i>View raw data as JSON</i> button on the <i>Test</i> tab shows what the service actually received."
K26 = "Basis"
K27 = "The connection uses <i>carconnectivity</i> by Till Steinbach and <i>carconnectivity-connector-audi</i> by Achim Fischer (both MIT). They are not an official Audi interface and may change at any time."
