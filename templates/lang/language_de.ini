WARN_GEFAHR_OHNE_SPIN = "Eingreifende Befehle sind freigegeben, aber es ist keine S-PIN hinterlegt. Ver- und Entriegeln wird der Connector damit abweisen. Bitte die S-PIN oben eintragen."
