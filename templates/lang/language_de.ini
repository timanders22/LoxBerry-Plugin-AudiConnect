H_ERKANNT = "Erkannte Fahrzeuge"
H_GEFAHR_EIN = "Erst setzen, wenn Sie die Wirkung an Ihrem Fahrzeug wirklich erproben wollen. Der Haken darüber muss ebenfalls gesetzt sein — dieser hier wirkt zusätzlich, nicht an seiner Stelle."
H_GERECHNET = "Gerechnete Größen"
H_GPS_EIN = "Ist der Haken aus, holt der Dienst den Standort gar nicht erst ab. Dann steht er in keiner Datei, in keinem MQTT-Thema und in keiner Antwort an den Miniserver — auch die Werte ZUHAUSE und ENTF entstehen nicht mehr."
H_HEIM = "Heimatposition und Radius. Steht das Fahrzeug näher als der Radius, ist ZUHAUSE = 1. Die Koordinaten finden Sie in jeder Karten-Anwendung; drei Nachkommastellen sind rund hundert Meter, fünf sind gut ein Meter."
H_INTERVALL = "Abstand zwischen zwei Abrufen. Zulässig sind 180 bis 3600 Sekunden — 180 ist die Untergrenze der Bibliothek, nicht eine Vorsichtsmaßnahme dieses Plugins."
H_KAPAZITAET = "Nutzbare Kapazität der Antriebsbatterie in kWh. Der Audi-Connector liefert sie nicht (nachgemessen), deshalb steht sie hier. Ohne diese Zahl entstehen VERBRAUCH und LADEKWH nicht. 0 heißt: nicht hinterlegt."
H_KONTO = "Zugang zum Audi-Konto"
H_LADEEMPF = "Ladeempfehlung aus einem fremden Thema"
H_LADEEMPF_ALTER = "Wie alt darf der letzte Wert höchstens sein, damit er noch gilt? Danach entsteht keine Empfehlung mehr — und keine 0, denn niemand hat gesagt, dass gerade nicht geladen werden soll."
H_LADEEMPF_GRENZE = "Der Schwellwert. Negative und gebrochene Zahlen sind erlaubt — an der Börse kostet Strom zeitweise weniger als nichts."
H_LADEEMPF_THEMA = "Das vollständige MQTT-Thema, aus dem der Vergleichswert kommt. Zum Beispiel der aktuelle Börsenpreis aus einem der Spotpreis-Plugins oder ein PV-Überschuss in Watt."
H_LADEEMPF_UNTER = "Gesetzt: empfehlen, wenn der Wert <b>kleiner oder gleich</b> der Grenze ist (passend für einen Strompreis). Nicht gesetzt: empfehlen, wenn er <b>größer oder gleich</b> ist (passend für einen PV-Überschuss)."
H_MELDEN_EIN = "Legt Störungen zusätzlich in den Benachrichtigungsbereich des LoxBerry. Gemeldet wird erst nach drei erfolglosen Abrufen in Folge — eine einzelne Störung bei Audi ist kein Anlass, jemanden zu behelligen."
H_MQTT_TOPIC = "Erlaubt sind Buchstaben, Ziffern, Bindestrich, Unterstrich und Schrägstrich. Aus dem Präfix ergeben sich alle Themen, siehe Reiter MQTT."
H_NUR_MINISERVER = "Nimmt am Endpunkt nur noch Aufrufe von den Adressen an, die LoxBerry als Miniserver kennt. Ist keine bekannt, bleibt der Haken wirkungslos — eine leere Liste würde sonst jeden Zugriff abweisen, auch den berechtigten. Bekannte Adressen:"
