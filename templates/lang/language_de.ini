H_LADEEMPF_THEMA = "Das vollständige MQTT-Thema, aus dem der Vergleichswert kommt. Zum Beispiel der aktuelle Börsenpreis aus einem der Spotpreis-Plugins oder ein PV-Überschuss in Watt. Erlaubt sind Buchstaben, Ziffern, Punkt, Bindestrich und Unterstrich, Ebenen getrennt durch einen Schrägstrich – keine Platzhalter + oder #, gebraucht wird genau ein Wert."
H_LADEEMPF_UNTER = "Gesetzt: empfehlen, wenn der Wert <b>kleiner oder gleich</b> der Grenze ist (passend für einen Strompreis). Nicht gesetzt: empfehlen, wenn er <b>größer oder gleich</b> ist (passend für einen PV-Überschuss)."
H_MELDEN_EIN = "Legt Störungen zusätzlich in den Benachrichtigungsbereich des LoxBerry. Gemeldet wird erst nach drei erfolglosen Abrufen in Folge — eine einzelne Störung bei Audi ist kein Anlass, jemanden zu behelligen."
H_MQTT_TOPIC = "Erlaubt sind Buchstaben, Ziffern, Bindestrich und Unterstrich, Ebenen getrennt durch einen Schrägstrich (keiner am Anfang oder Ende). Aus dem Präfix ergeben sich alle Themen, siehe Reiter MQTT. Die Abodatei des Gateways folgt ihm beim Speichern."
H_NUR_MINISERVER = "Nimmt am Endpunkt nur noch Aufrufe von den Adressen an, die LoxBerry als Miniserver kennt. Ist keine bekannt, bleibt der Haken wirkungslos — eine leere Liste würde sonst jeden Zugriff abweisen, auch den berechtigten. Bekannte Adressen:"
H_PASSWORT = "Bleibt das Feld leer, bleibt das gespeicherte Passwort unverändert. Es wird nie angezeigt — im Reiter Test steht nur seine Länge."
H_PROBE_EIN = "Im Probelauf wird jeder schaltende Befehl vollständig geprüft — Freigaben, Grenzen, Drosselung, ob das Fahrzeug die Funktion überhaupt anbietet —, aber <b>nichts an das Fahrzeug gesendet</b>. So lässt sich die ganze Kette von Loxone bis zur Warteschlange prüfen, ohne das Auto anzufassen. Jede Antwort beginnt dann mit dem Wort PROBE."
H_SICHERUNG = "Einstellungen sichern und zurückspielen"
H_SIGNAL = "Meldungen an SignalBot"
H_SIGNAL_EIN = "Ab Werk aus. Die Ereignisse darunter lassen sich einzeln abwählen."
H_SIGNAL_PRAEFIX = "Wie im SignalBot eingestellt (ab Werk <span class='sm-mono'>signalbot</span>)."
H_SPIN = "Die vierstellige S-PIN aus der myAudi-App. Gebraucht wird sie nur für <b>Ver- und Entriegeln</b>; ohne sie weist der Connector diese beiden Befehle ab. Wer sie nicht braucht, lässt das Feld leer."
H_STEUERUNG = "Schreibende Befehle"
H_STROMPREIS = "Strompreis und Ladekosten"
H_STROM_ABSTAND = "Kürzester Abstand zwischen zwei Änderungen des Ladestroms. Für das Überschussladen wichtig: ein Regler in Loxone liefert alle paar Sekunden einen neuen Sollwert, und jeder davon wäre eine Anfrage an Audi. Derselbe Wert wird ohnehin nie zweimal gesendet."
H_TAKT = "Abholtakt"
H_TAKT_WARTUNG = "Inspektion und Ölservice ändern sich in Tagen, nicht in Minuten. Bei einem Takt von 300 Sekunden bedeutet 12 also: einmal je Stunde."
H_TEMP = "Grenzen für die Klimatisierung. Ein Wert außerhalb wird <b>abgewiesen</b>, nicht auf die Grenze gekappt: ein still veränderter Sollwert führt zu einem Fahrzeug, das etwas anderes tut als angezeigt."
H_VERLAUF_TAGE = "Wie lange die Messpunkte für die Tagesgrafik und die Ladevorgänge aufgehoben werden."
H_VORKLIMA_ANWESEND_EIN = "Liest <span class='sm-mono'>haus/anwesenheit/jemand</span> (BLE-Scanner NG). Meldet die Quelle 0, wartet die Vorklimatisierung; schweigt sie, gilt die Anwesenheit als nicht gesetzt. Ab Werk aus."
H_VORKLIMA_WETTER_EIN = "Außentemperatur zuerst aus Loxone (<span class='sm-mono'>audi/befehl/aussentemp</span>, bis 30 Minuten alt), sonst vom Fahrzeug (bis 60 Minuten alt). Liegt sie zwischen den beiden Grenzen, wird nicht klimatisiert; ohne Wert wird klimatisiert. Ab Werk aus."
H_WARTEZEIT = "So lange wartet die Oberfläche, bis der Dienst einen Befehl beantwortet hat. Danach meldet sie <span class='sm-mono'>OK=2</span> — eingereiht, Ergebnis unbekannt. Es wird bewusst kein Erfolg gemeldet, den niemand geprüft hat. <b>Ausnahme:</b> Für Klimatisierung, Laden, Wecken und die eingreifenden Befehle wartet die Oberfläche mindestens 30 Sekunden, auch wenn hier weniger steht — bei Audi dauert das Wecken eines geparkten Fahrzeugs regelmäßig zwanzig bis fünfundvierzig Sekunden."
H_ZUGANG_LOESCHEN = "Löscht E-Mail, Passwort und S-PIN und dazu die Anmeldemarken der Bibliothek (<span class='sm-mono'>token.json</span>). Was dabei <b>nicht</b> geschieht: ein laufender Dienst wird nicht angehalten, und eine heruntergeladene Sicherungsdatei bleibt, wo sie ist – sie trägt die Zugangsdaten weiterhin."
