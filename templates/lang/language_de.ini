FEHLER_TEMP_TAUSCH = "Die kleinste Zieltemperatur ist größer als die größte. Bitte die beiden Werte tauschen."
FEHLER_THEMA = "Das Thema für die Ladeempfehlung ist ungültig. Erlaubt sind Buchstaben, Ziffern, Punkt, Bindestrich und Unterstrich, Ebenen getrennt durch einen Schrägstrich – ohne Schrägstrich am Anfang oder Ende, ohne leere Ebene und ohne die Platzhalter + und #."
