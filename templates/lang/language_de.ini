NICHT_GELIEFERT_ERKLAERUNG = "<b>Kennzeichen, Batteriekapazität und Softwarestand bleiben leer, und das ist kein Fehler.</b> Am Quelltext des Audi-Connectors 0.3.2 nachgemessen: er füllt diese Felder an keiner Stelle — ebenso wenig Baujahr, Hersteller, Handbremse und Ölstand. Das Kernmodell der Bibliothek kennt sie, der Audi-Teil bedient sie nicht. Eine spätere Fassung des Connectors kann das ändern; bis dahin steht hier ein ehrlicher Strich statt einer erfundenen Zahl. Die Batteriekapazität lässt sich unter <i>Gerechnete Größen</i> von Hand hinterlegen."
PAHO_FEHLT = "<b>Das Python-Modul paho-mqtt fehlt.</b> Ohne es kann das Plugin keine fremden Themen lesen; Vorklimatisierung und Ladeempfehlung bleiben wirkungslos. Es wird bei der Installation geholt und braucht dafür eine Internetverbindung — das Plugin einmal neu zu installieren genügt."
PROBE_LAEUFT = "Schaltende Befehle werden vollständig geprüft, aber <b>nicht an das Fahrzeug gesendet</b>. Jede Antwort beginnt mit dem Wort PROBE. Abzuschalten im Reiter Einstellungen."
PW_GESETZT = "gespeichert (%d Zeichen) – leer lassen, um es zu behalten"
PW_LEER = "noch kein Passwort gespeichert"
PYTHON_ZU_ALT = "<b>Der Dienst kann nicht laufen.</b> Die virtuelle Python-Umgebung dieses Plugins nutzt ein Python älter als 3.9; die Bibliothek carconnectivity verlangt 3.9 oder neuer. Das sollte auf keinem heutigen LoxBerry vorkommen (Debian 12 liefert 3.11) — wenn doch, ist die virtuelle Umgebung kaputt. Abhilfe: Plugin neu installieren."
SITZUNG_ERKLAERUNG = "Nach der ersten Anmeldung legt die Bibliothek Anmeldemarken in einer eigenen Datei mit den Rechten 0600 ab und meldet sich damit an, statt jedes Mal das Passwort zu senden. Das schont die Anmeldeseite von Audi, die wiederholte Anmeldungen drosselt. Nach einem Passwortwechsel sind die Marken wertlos — dann hilft der Knopf <i>Anmeldung neu erzwingen</i> oben."
SITZUNG_KEINE = "Es waren keine Anmeldemarken gespeichert."
SITZUNG_VERWORFEN = "Die Anmeldemarken wurden gelöscht. Beim nächsten Abruf meldet sich der Dienst mit Benutzername und Passwort neu an."
SPIN_GESETZT = "gespeichert – leer lassen, um sie zu behalten"
SPIN_LEER = "keine S-PIN gespeichert"
STEUERUNG_ERKLAERUNG = "Ab Werk <b>gesperrt</b>. Schreibende Befehle greifen in ein Fahrzeug ein, das irgendwo steht — ein versehentlich gestarteter Standklimaanlagenlauf entlädt die Batterie, und ein angehaltener Ladevorgang fällt erst am nächsten Morgen auf. Erst freigeben, wenn die Lesewerte im Reiter Test stimmen."
TAKT_WARNUNG = "<b>Untergrenze 180 Sekunden.</b> Der Audi-Connector nimmt darunter gar nichts an — er wirft beim Anlegen einen Fehler. Und auch darüber gilt: zu häufige Anfragen weist Audi mit HTTP 429 ab, und ein ständig geweckter Wagen kostet Ruhestrom. Fünf Minuten sind ein guter Anfang. Wird ein Wert sofort gebraucht, ist der Abruf-Befehl der richtige Weg, nicht ein kürzerer Takt."
