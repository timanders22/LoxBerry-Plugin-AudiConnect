H_KAPAZITAET = "Nutzbare Kapazität der Antriebsbatterie in kWh. Der Audi-Connector liefert sie nicht (nachgemessen), deshalb steht sie hier. Ohne diese Zahl entstehen VERBRAUCH und LADEKWH nicht. 0 heißt: nicht hinterlegt."
H_KONTO = "Zugang zum Audi-Konto"
