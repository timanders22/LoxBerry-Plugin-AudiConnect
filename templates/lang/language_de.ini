FEHLER_TOPIC = "Das Themenpräfix ist ungültig. Erlaubt sind Buchstaben, Ziffern, Bindestrich und Unterstrich, Ebenen getrennt durch einen Schrägstrich – ohne Schrägstrich am Anfang oder Ende, ohne leere Ebene, höchstens 64 Zeichen. Es wird nichts still berichtigt."
