S2_TEXT = "Nur nötig, wenn Sie den MQTT-Weg gehen. Die Themengruppe dieses Plugins lautet:"
S2_TITEL = "Schritt 2: Das Abo im MQTT-Gateway"
S3_ADRESSE_ZEILE = "Der Standort-Abruf liefert eine <b>zweite Zeile</b> mit der Anschrift im Klartext. Sie ist für eine Textanzeige gedacht, nicht für eine Befehlserkennung; die erste Zeile besteht bewusst nur aus Zahlen."
S3_STRICH = "<b>Ein Strich statt einer Zahl bedeutet: dieser Wert liegt nicht vor.</b> Es wird bewusst keine 0 gesendet — eine 0 wäre eine stille Falschaussage. Loxone behält in diesem Fall den letzten gültigen Wert. Genau deshalb braucht es die Ausfallerkennung aus Schritt 7. Felder, die in der Spalte <i>Herkunft</i> mit <i>bleibt leer</i> gekennzeichnet sind, liefert der Audi-Connector überhaupt nicht — sie stehen der Vollständigkeit halber da."
S3_TEXT = "In Loxone Config: <i>Virtueller Eingang → Virtueller HTTP-Eingang</i>. Für jeden der vier Abrufe ein eigener Eingang. Der Knopf unter jeder Tabelle erzeugt die fertige Importdatei — das ist weniger mühsam und weniger fehleranfällig als das Abtippen. Die Tabelle bleibt trotzdem stehen: sie erklärt, was importiert wird. Der Lade-Eingang bleibt bei einem reinen Verbrenner leer; dort stehen dann überall Striche, und das ist richtig so."
S3_TITEL = "Schritt 3: Virtuelle HTTP-Eingänge anlegen"
S4_TEXT = "Zahlen kann Loxone gut, Klartext nicht. Die Klartexte – welchen Zustand das Fahrzeug meldet, ob die Klimatisierung heizt oder kühlt, <b>welche</b> Tür offen steht, die Anschrift und den Namen der Ladesäule – kommen über MQTT: Mit eingeschaltetem MQTT legt das MQTT-Gateway dafür Virtuelle Texteingänge an, etwa <span class='sm-mono'>audi_fahrzeug1_tueren_namen</span> (Präfix audi); den Titel genau so lassen. Ein Virtueller Texteingang fragt selbst nichts ab und kennt keine Befehlserkennung – der Abruf <span class='sm-mono'>text</span> unten ist deshalb zum Ansehen im Browser gedacht. Die Seiten in Schritt 8 zeigen dasselbe ohne MQTT über Status-Bausteine aus den Zahlen."
S4_TITEL = "Schritt 4: Klartexte für die App (über MQTT)"
S5_TEXT = "Nur nötig, wenn Loxone etwas auslösen soll. Der Knopf unten erzeugt einen fertigen virtuellen Ausgang samt aller Befehle — bis 0.9.7 musste man sie einzeln abtippen, jede Zeile mit einem 24-stelligen Token darin. Im Befehlstext steht <span class='sm-mono'>&lt;v.1&gt;</span> für eine Temperatur mit einer Nachkommastelle und <span class='sm-mono'>&lt;v.0&gt;</span> für eine ganze Zahl (Ladegrenze, Ladestrom). Die Titel der Befehle sind fest deutsch, auch bei englischer Oberfläche; die Klimatisierung startet mit der Temperatur und geht über den eigenen Befehl „Klimatisierung aus“ aus. Wer die Vorlage vor Fassung 0.9.28 eingelesen hat, liest sie neu ein. <b>Achtung: hier steht das Schalttoken</b>, nicht das Lesetoken."
S5_TITEL = "Schritt 5: Befehle senden (virtueller Ausgang)"
S5_WARNUNG = "Drei Dinge, die man vorher wissen sollte. <b>Erstens:</b> Schreibende Befehle sind ab Werk gesperrt und müssen im Reiter Einstellungen erst freigegeben werden; Ver- und Entriegeln, Hupe und Lichthupe brauchen zusätzlich den zweiten Haken und erscheinen sonst gar nicht erst in der Vorlage. <b>Zweitens:</b> Eine Antwort mit <span class='sm-mono'>OK=1</span> heißt, dass der Audi-Server den Auftrag mit HTTP 200 entgegengenommen hat. Ob das Fahrzeug ihn ausführt, zeigt erst der nächste Abruf — wer sicher sein will, wertet den zurückgelesenen Zustand aus und nicht die Antwort auf den Befehl. <b>Drittens:</b> Die Drosselung weist zu dichte Befehle ab. Das ist Absicht und schützt Ihr Konto; der Grund steht in der Antwort."
S6_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Geschützt ist er durch diese beiden Token. <b>Warum zwei?</b> Das Lesetoken steht in jeder Adresse eines virtuellen Eingangs und damit in jeder Loxone-Projektdatei, die weitergegeben wird. Bis 0.9.7 konnte man mit genau diesem Token auch die Klimatisierung starten. Schaltende Aufrufe verlangen jetzt das Schalttoken; lesende nehmen beide an. <b>Ein neues Token macht alle betroffenen Adressen auf einen Schlag ungültig</b> und muss überall nachgetragen werden. Würfeln Sie also nur neu, was tatsächlich in falsche Hände geraten ist."
S6_TITEL = "Schritt 6: Die beiden Token"
S7_TEXT = "Schweigt die Cloud, behalten die virtuellen Eingänge ihren letzten Wert. In der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr angekommen ist. Deshalb wird der Wert <span class='sm-mono'>ALTER</span> mitgeführt: er sagt, wie alt das Abbild in Sekunden ist. <span class='sm-mono'>OK</span> fällt auf 0, sobald das Abbild älter ist als drei Abholtakte. Steht aber der LoxBerry selbst, frieren auch OK und ALTER ein – das erkennt nur eine Analogwertvalidierung am Alter (Tmc 900 Sekunden bei 300 Sekunden Takt; Seite „AudiConnect“ in Schritt 8). Beides läuft über ein ODER an eine Meldung. Zusätzlich gibt es seit 0.9.8 <span class='sm-mono'>FEHLFOLGE</span> (wie viele Abrufe hintereinander schiefgingen) und <span class='sm-mono'>GRUND</span> (warum). Damit lässt sich eine vorübergehende Störung bei Audi von einer Kontosperre unterscheiden, ohne in die Logdatei zu sehen."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_TEXT = "Vier Seiten aus dem LoxBerry-Plugins Musterprojekt, dort in Loxone Config gebaut und verbunden. Jede Zeile ein Baustein; Loxone Config führt alle in der Baustein-Suche (Taste F5), die Befehle der Vorlagen aus Schritt 3 und 5 stehen nach dem Einlesen im Baum. Wer nur überwachen will, übernimmt die erste Seite allein. Die Namen gelten für das Fahrzeug mit der kleinsten Nummer, so wie die Vorlagen sie anlegen; die Titel der Befehle sind fest deutsch, auch bei englischer Oberfläche."
S8_TITEL = "Schritt 8: Vier Seiten aus dem Musterprojekt zum Nachbauen"
S9_TEXT = "Diese vier Adressen im Browser aufrufen. Die erste muss Werte liefern, die drei anderen müssen <b>abgewiesen</b> werden — wenn nicht, ist etwas an der Absicherung falsch. Die letzte ist die Gegenprobe auf die Trennung der beiden Token."
S9_TITEL = "Schritt 9: Gegenprobe"
TOKEN_ART_UNBEKANNT = "Es wurde kein Token erzeugt: die Anfrage nannte keine der drei zulässigen Arten (Lesen, Schalten, beide)."
TOKEN_NEU = "Es wurde ein neues Token erzeugt. Alle bisher im Miniserver eingetragenen Adressen, die es enthalten, sind damit ungültig und müssen nachgetragen werden."
T_ADRESSE = "Adresse"
T_BAUSTEIN = "Baustein (Typ)"
T_BEDEUTUNG = "Bedeutung"
T_BEFEHL = "Befehlserkennung"
T_EINGAENGE = "Eingänge verbinden mit"
T_EINHEIT = "Einheit"
T_ERWARTUNG = "Erwartete Antwort"
T_HERKUNFT = "Herkunft"
T_NAMENSVORSCHLAG = "Name (Vorschlag)"
T_PARAMETER = "Parameter"
T_PRUEFUNG = "Aufruf"
T_TITEL = "Bezeichnung"
T_TOKEN_LESEN = "Lesetoken (virtuelle Eingänge)"
T_TOKEN_SCHALTEN = "Schalttoken (virtuelle Ausgänge)"
T_VA_ADRESSE = "Adresse des virtuellen Ausgangs"
T_ZIEL = "Befehlstext"
T_ZYKLUS = "Abfragezyklus"
VORLAGE_VO_HINWEIS = "Erzeugt vom LoxBerry-Plugin Audi Connect. Das enthaltene Schalttoken macht diese Datei vertraulich."

[BAUSTEIN]
HINWEISE_TITEL = "Hinweise"
S1_H1 = "Fällt der Abrufdienst aus oder ist Audi länger gestört, wird AUDI_1_OK nach drei Abruftakten 0 (ab Werk 15 Minuten); die Meldung folgt 10 Minuten später. Steht der LoxBerry selbst, frieren alle Werte ein – das erkennt nur die Analogwertvalidierung Nr. 16 (nach 15 Minuten ohne neues Alter, Meldung nach insgesamt 25 Minuten)."
S1_H2 = "Zu Nr. 16: Im HTTP-Weg liefert Audi keinen Laufzähler; das Alter ändert sich bei jeder Abfrage und dient als Lebenszeichen. Wer den Abruftakt im Plugin verlängert, setzt Tmc auf das Dreifache der Abfragezeit des Behälters."
S1_H3 = "Zu Nr. 22 und 24: Ein Wert, den das Fahrzeug nie liefert (Elektroauto ohne Tank, Verbrenner ohne Akku), steht in Loxone auf 0 – die Formeln davor verhindern eine Dauermeldung. Die Schwellwertschalter geben hinter einem abgefragten Eingang bei jeder Abfrage einen kurzen Impuls; die Einschaltverzögerung Nr. 28 schluckt ihn."
S1_H4 = "„Meldung Ladung beendet (Audi)“ kommt bei jedem Ladeende – auch beim Kabelziehen und bei jeder Pause von „Laden nach Empfehlung“. Wer das nicht will, legt ein UND mit negiertem „Empfehlung hält an (Audi)“ (Seite „AudiConnect Laden“) davor."
S1_H5 = "Ein zweites Fahrzeug: im Reiter dieselben vier Vorlagen für Fahrzeug 2 holen (die Befehle heißen AUDI_2_…), die Seiten kopieren und die Befehle tauschen; seine Störung über ein weiteres ODER vor Nr. 19 führen – nie zwei Quellen direkt an eine Benachrichtigung."
S1_H6 = "Mit EVCC an der eigenen Wallbox meldet die Seite „EVCC“ die fertige Ladung am Ladepunkt schon; diese Seite meldet auch unterwegs. Wer beides hat, lässt eine der beiden Meldungen weg."
S1_H7 = "Ansagen („Ladung beendet“, „steht offen“, „Licht an“, „keine Daten mehr“) spricht das Plugin selbst (Reiter Einstellungen, ab Werk an) – kein Baustein. Nach „%s“ die Adresse in allen vier Behältern erneuern."
S1_SCHRITT1 = "Im Plugin Reiter „%s“ myAudi-E-Mail, Passwort und S-PIN eintragen, speichern, „%s“. Nach einigen Minuten im Reiter „%s“ „%s“ – es kommen Werte."
S1_SCHRITT2 = "Reiter „%s“, Schritt 3: die vier Vorlagen „%s“, „%s“, „%s“ und „%s“ für Fahrzeug 1 holen und in Loxone Config einlesen: im Baum „Virtuelle Eingänge“ wählen, Menüband „Vordefinierte HTTP-Geräte → Vorlage importieren…“. Jede nur EINMAL einlesen (zweimal ergibt doppelte Eingänge). Die Behälter „Audi 1 STATUS“, „Audi 1 LADEN“, „Audi 1 WARTUNG“ und „Audi 1 POSITION“ dienen allen vier Seiten."
S1_SCHRITT3 = "Seite „AudiConnect“ anlegen, aus „Audi 1 STATUS“ die Befehle Nr. 1–12 ziehen, aus „Audi 1 LADEN“ AUDI_1_LAEDT und AUDI_1_KABEL (Nr. 13 und 14), dazu die Konstante 1 (Nr. 15). Achtung: AUDI_1_OK, AUDI_1_ALTER, AUDI_1_GRUND und AUDI_1_SOC gibt es in mehreren Behältern – den aus dem genannten Behälter nehmen. „Statistik“ an AUDI_1_SOC und AUDI_1_REICHW einschalten."
S1_SCHRITT4 = "Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Auto gestört (Audi)“, „Meldung Ladestand niedrig (Audi)“ und „Meldung Ladung beendet (Audi)“, Texte wie in der Liste, auf die Seite ziehen. Jede bekommt genau eine Leitung (von Nr. 19, von Nr. 28 und vom Ausgang Off der Nr. 32)."
S1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, von oben nach unten verbinden; jedes UND und ODER hat zwei Eingänge. An der Analogwertvalidierung Nr. 16 den Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an und die Meldung löst nie aus). UND Nr. 27: den Eingang I2 negieren – in Config auf seinen Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Status „Zustand (Audi)“ und „Ladestand und Reichweite (Audi)“: vorher je viermal „+“ klicken (V5–V8); die Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt. „In Visualisierung verwenden“ an beiden Status."
S1_SCHRITT6 = "Speichern und übertragen. Probe: „Zustand (Audi)“ zeigt „läuft – Werte … s alt“. In Config nachsehen, dass an der Flankenerkennung Nr. 32 der Eingang an Nr. 31 hängt und die Benachrichtigung am Ausgang Off."
S2_H1 = "Ein Verbrenner lässt die Ladewerte leer (Strich) – diese Seite braucht er nicht."
S2_H2 = "Mit EVCC oder einer anderen Wallbox-Regelung „Laden nach Empfehlung (Audi)“ aus lassen (oder Nr. 29–35 weglassen) – die Wallbox regelt; zwei Regler streiten."
S2_H3 = "Zu Nr. 31: AUDI_1_ZUHAUSE braucht die Heimatposition, AUDI_1_LADEEMPF ein Thema im Plugin; fehlt eins, schaltet das UND nicht – richtig so."
S2_H4 = "Jeder Befehl weckt das Fahrzeug über Mobilfunk; Audi drosselt bei zu vielen Aufträgen, das Plugin lässt höchstens 30 je Stunde zu und ändert den Ladestrom frühestens alle 5 Minuten. Die Schieberegler nicht hin- und herschieben."
S2_H5 = "Die Ladegrenze rundet das Plugin auf Zehner; als Ladestrom gelten bei allen Fahrzeugen nur 6 A (reduziert) und 16 A (maximal)."
S2_H6 = "Ob ein Befehl wirkt, zeigt erst der nächste Abruf (Status „Laden (Audi)“), nicht die Antwort des Plugins."
S2_SCHRITT1 = "Die Behälter „Audi 1 LADEN“ und „Audi 1 STATUS“ kommen von der Seite „AudiConnect“, Schritt 2 (nicht erneut einlesen). Im Plugin Reiter „%s“ unter „%s“ die Batteriekapazität eintragen (für Verbrauch und geladene Menge), dazu „%s“ mit einem Thema (z. B. Börsenpreis) und die Heimatposition (für „zu Hause“)."
S2_SCHRITT2 = "Im Plugin Reiter „%s“ den Haken „%s“ setzen (ab Werk aus – sonst antwortet jeder Befehl mit STEUERUNG_AUS); den zweiten Haken „%s“ NICHT setzen. Reiter „%s“, Schritt 5: „Vorlage virtueller Ausgang — Fahrzeug 1“ holen und einlesen: Baum „Virtuelle Ausgänge“ → „Vordefinierte Geräte → Vorlage importieren…“. Die Datei enthält das Schalttoken – nicht weitergeben. Der Behälter „Audi 1 steuern“ dient auch der Seite „AudiConnect Klima und Befehle“; wer ihn vor Fassung 0.9.28 eingelesen hat, liest ihn neu ein."
S2_SCHRITT3 = "Seite „AudiConnect Laden“ anlegen, aus „Audi 1 LADEN“ die Befehle Nr. 1–18 ziehen (Nr. 18 ist AUDI_1_SOC aus LADEN, nicht aus STATUS), aus „Audi 1 STATUS“ AUDI_1_ZUHAUSE (Nr. 30), aus „Audi 1 steuern“ die Befehle Nr. 26, 28 und 36. „Statistik“ an AUDI_1_LADEKW einschalten."
S2_SCHRITT4 = "Die Benachrichtigung „Meldung Ladestörung (Audi)“ anlegen (Text wie in der Liste, eine Leitung von Nr. 23). Die Virtuellen Eingänge anlegen: die Schieberegler Nr. 25 und 27 (Grenzen und Startwerte wie in der Liste) und die Schalter Nr. 29 und 34, je „In Visualisierung verwenden“ an."
S2_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (Taste F5), Parameter wie in der Liste, von oben nach unten verbinden; jedes UND und ODER hat zwei Eingänge. Status „Laden (Audi)“: vorher viermal „+“ klicken (V5–V8), „Ladetechnik (Audi)“ dreimal (V5–V7). „In Visualisierung verwenden“ an den drei Status."
S2_SCHRITT6 = "Speichern und übertragen. Probe: Kabel einstecken – „Laden (Audi)“ zeigt nach dem nächsten Abruf „Kabel steckt …“ bzw. „lädt mit … kW“."
S3_H1 = "Zu Nr. 16 und 17: „AUDI 1 Klimatisierung“ ist ein Analogbefehl mit der Temperatur (<v.1>) und ohne Aus-Befehl. Im Ruhezustand liefert die Formel -1; diesen Wert weist das Plugin ohne Wirkung ab. Aus geht die Klimatisierung nur über „Klima aus (Audi)“."
S3_H2 = "Den Temperaturregler nicht hin- und herschieben, während die Klimatisierung läuft – jede Änderung ist ein neuer Auftrag an Audi (höchstens 30 je Stunde)."
S3_H3 = "Wer den Abfahrtsassistenten nutzt, kann statt Schaltuhr und UND (Nr. 12–14) im Plugin „%s“ einschalten – dann klimatisiert Audi Connect selbst zur Abfahrt."
S3_H4 = "Die Schalter der Einstellungen (Nr. 20–29) zeigen nur, was zuletzt aus Loxone gesendet wurde; was im Fahrzeug steht, zeigen „Klima (Audi)“ und „Ladetechnik (Audi)“."
S3_H5 = "„AUDI 1 Zieltemperatur“ und die vier Klimazonen der Vorlage sind nicht im Muster; eine Klimazone baut man wie Nr. 20 und 21: Schalter → Befehl."
S3_H6 = "Ver- und Entriegeln, Hupe und Lichthupe sind bewusst nicht im Muster: sie brauchen den zweiten Haken „%s“ und gehören nicht in eine App für alle."
S3_H7 = "„Jetzt abrufen“ gilt für das ganze Konto (frühestens alle 60 s); „Fahrzeug wecken“ sparsam benutzen – jeder Weckruf geht über Mobilfunk ans Fahrzeug."
S3_SCHRITT1 = "Die Behälter „Audi 1 STATUS“ und „Audi 1 steuern“ kommen von den Seiten „AudiConnect“ und „AudiConnect Laden“ (nicht erneut einlesen); der Haken „%s“ muss im Plugin gesetzt sein."
S3_SCHRITT2 = "Seite „AudiConnect Klima und Befehle“ anlegen, aus „Audi 1 STATUS“ die Befehle Nr. 1–8 ziehen, aus „Audi 1 steuern“ die neun Befehle Nr. 17, 19, 21, 23, 25, 27, 29, 31 und 33, dazu „Anwesenheit (eigene Quelle)“ (Nr. 13) – im eigenen Projekt die eigene Anwesenheit nehmen."
S3_SCHRITT3 = "Die zehn Virtuellen Eingänge anlegen (ein Schieberegler, vier Tasten, fünf Schalter), Werte wie in der Liste, je „In Visualisierung verwenden“ an. Die Schaltuhr Nr. 12 über die Baustein-Suche (Taste F5) setzen und die Schaltzeiten Montag bis Freitag 06:40–07:00 EIN eintragen (eigene Abfahrtszeit minus 20 Minuten)."
S3_SCHRITT4 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen und von oben nach unten verbinden; das UND Nr. 14 hängt am Ausgang AQ der Schaltuhr. Status „Klima (Audi)“: vorher viermal „+“ klicken (V5–V8), „In Visualisierung verwenden“ an."
S3_SCHRITT5 = "Speichern und übertragen. Probe: „Klima jetzt (Audi)“ drücken – nach dem nächsten Abruf zeigt „Klima (Audi)“ „heizt“ oder „kühlt“; „Klima aus (Audi)“ hält die Klimatisierung an."
S4_H1 = "Wer das NICHT Nr. 21 sparen will: den Eingang I1 des ODER Nr. 22 negieren – in Config auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis."
S4_H2 = "Zu Nr. 25: Die Offen-Meldung kommt nur, wenn das Fahrzeug steht (0 offline oder 1 geparkt) und die Werte gültig sind – während der Fahrt ist das Auto oft nicht verriegelt."
S4_H3 = "Zu Nr. 29: 0 heißt „nicht geliefert“ (z. B. kein Ölservice beim Elektroauto); eine heute fällige Inspektion zählt deshalb nicht, die Meldung kam schon bei 14 Tagen. Wer einen Diesel fährt, baut für AdBlue dieselben drei Bausteine."
S4_H4 = "Der Standort steht in der App für alle Benutzer mit Zugriff auf diese Seite; wer das nicht will, lässt Nr. 13–15 weg oder schaltet im Plugin „%s“ aus."
S4_H5 = "Wartungswerte holt das Plugin nur jede Stunde (Einstellung „%s“)."
S4_H6 = "Klartexte (welche Tür, Anschrift, Ladesäule) gibt es nur über MQTT – mit eingeschaltetem MQTT legt das MQTT-Gateway Virtuelle Texteingänge wie audi_fahrzeug1_tueren_namen an; den Titel genau so lassen."
S4_SCHRITT1 = "Im Plugin Reiter „%s“ „%s“ anhaken und die Heimatposition (Breite, Länge, Radius) eintragen – ohne sie bleiben „zu Hause“ und die Entfernung leer."
S4_SCHRITT2 = "Seite „AudiConnect Fahrzeug“ anlegen, aus „Audi 1 STATUS“ die Befehle Nr. 1–12, aus „Audi 1 POSITION“ Nr. 13–15 und aus „Audi 1 WARTUNG“ Nr. 16–20 ziehen. „Statistik“ an AUDI_1_KM einschalten."
S4_SCHRITT3 = "Zwei Benachrichtigungen anlegen: „Meldung Fahrzeug offen (Audi)“ und „Meldung Service fällig (Audi)“, Texte wie in der Liste; jede bekommt genau eine Leitung (von Nr. 27 bzw. Nr. 31)."
S4_SCHRITT4 = "Übrige Bausteine über die Baustein-Suche (Taste F5), Parameter wie in der Liste, von oben nach unten verbinden; jedes UND und ODER hat zwei Eingänge. „+“ klicken: „Türen und Fenster (Audi)“ viermal (V5–V8), „Standort und Kilometer (Audi)“ dreimal (V5–V7), „Wartung (Audi)“ zweimal (V5, V6). „In Visualisierung verwenden“ an den drei Status."
S4_SCHRITT5 = "Speichern und übertragen. Probe: Fahrzeug abstellen und nicht abschließen – nach dem nächsten Abruf und 5 Minuten kommt „Meldung Fahrzeug offen (Audi)“."
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
Z1_01 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Audi 1 STATUS“) | AUDI_1_OK | 1 = die Werte sind gültig (höchstens dreimal so alt wie der Abruftakt, ab Werk 300 s), sonst 0 | —"
Z1_02 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Audi 1 STATUS“) | AUDI_1_ALTER | Alter der Werte in Sekunden – das Lebenszeichen: ändert sich bei jeder Abfrage, solange LoxBerry und Plugin antworten | —"
Z1_03 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Audi 1 STATUS“) | AUDI_1_GRUND | Fehlergrund: 0 in Ordnung, 1 noch nie abgerufen, 2 Anmeldung abgelehnt, 3 Konto gedrosselt, 4 Audi nicht erreichbar, 5 Störung bei Audi, 6 kein Fahrzeug im Konto, 7 Zugangsdaten fehlen, 8 Einrichtung fehlerhaft, 9 unbekannt, 10 Abrufdienst steht | —"
Z1_04 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Audi 1 STATUS“) | AUDI_1_FEHLFOLGE | Abrufe, die hintereinander scheiterten | —"
Z1_05 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Audi 1 STATUS“) | AUDI_1_FZOK | 1 = das Fahrzeug hat alle Abschnitte beantwortet | —"
Z1_06 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Audi 1 STATUS“) | AUDI_1_AUSFALL | Anzahl der Abschnitte, die das Fahrzeug nicht beantwortet hat | —"
Z1_07 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Audi 1 STATUS“) | AUDI_1_ERREICH | 1 = das Fahrzeug ist für die Audi-Cloud erreichbar | —"
Z1_08 = "Virtueller HTTP-Eingang-Befehl (Vorlage „Audi 1 STATUS“) | AUDI_1_ZUSTAND | 0 offline, 1 geparkt, 2 Zündung an, 3 fährt | —"
