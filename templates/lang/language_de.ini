ABFAHRT_ERKLAERUNG = "Wenn das Plugin <i>Abfahrtsassistent</i> auf diesem LoxBerry läuft, kann Audi Connect die Klimatisierung selbst starten — so viele Minuten vor der Abfahrt, wie unten eingestellt. Der Assistent veröffentlicht die verbleibenden Minuten über MQTT; dieses Plugin hört mit. <b>Ab Werk aus.</b> Ohne das Python-Modul paho-mqtt in der virtuellen Umgebung geht es nicht — die Installation holt es, wenn eine Internetverbindung besteht."
ANSAGE_ERKLAERUNG = "Das Plugin kann einzelne Ereignisse ansagen – über den Loxone Music Server, MusicServer4Home, eine eigene Adressvorlage, Alexa-NG oder Google-Lautsprecher (Chromecast 4 Lox NG). Ab Werk ist die Ausgabe <b>an</b>. Angesagt wird nur ein Wechsel, nie ein Wert im Takt; derselbe Anlass wird für dasselbe Fahrzeug höchstens einmal je eingestellter Sperrzeit, in der Nachtruhe nicht angesagt, und nach einem Neustart des Dienstes spricht die erste Abfrage nie. MQTT, Loxone und Benachrichtigungen bleiben davon unberührt. Adresse und Vorlage müssen im Heimnetz liegen."
DIENST_ERKLAERUNG = "Der Dienst holt die Werte im eingestellten Takt aus der Audi-Schnittstelle und legt sie ab. Oberfläche und Miniserver lesen nur das Abgelegte — sie sprechen nie selbst mit dem Anbieter."
DIENST_OHNE_ZUGANG = "Der Dienst wurde nicht gestartet: es sind noch keine Zugangsdaten hinterlegt. Bitte oben E-Mail-Adresse und Passwort des myAudi-Kontos eintragen, speichern und dann den Dienst starten."
