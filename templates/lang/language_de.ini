H_HAUS_STROMPREIS_EIN = "Während einer Ladung zu Hause merkt das Plugin je Minute den Endpreis aus <span class='sm-mono'>haus/strompreis</span> und weist nach dem Ladeende Kosten und Durchschnittspreis aus (Reiter Ladungen, Themen <span class='sm-mono'>fahrzeug&lt;n&gt;/ladung_kosten</span> und <span class='sm-mono'>ladung_preis</span>). Die Menge kommt aus Ladestand-Differenz × Batteriekapazität; fehlt der Preis für mehr als 10 % der Energie, bleiben die Kosten -1 – nie geschätzt. Braucht die Heimatposition. Ab Werk aus."
