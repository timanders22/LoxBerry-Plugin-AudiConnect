[EINST]
ABFAHRT_ERKLAERUNG = "Wenn das Plugin <i>Abfahrtsassistent</i> auf diesem LoxBerry läuft, kann Audi Connect die Klimatisierung selbst starten — so viele Minuten vor der Abfahrt, wie unten eingestellt. Der Assistent veröffentlicht die verbleibenden Minuten über MQTT; dieses Plugin hört mit. <b>Ab Werk aus.</b> Ohne das Python-Modul paho-mqtt in der virtuellen Umgebung geht es nicht — die Installation holt es, wenn eine Internetverbindung besteht."
DIENST_ERKLAERUNG = "Der Dienst holt die Werte im eingestellten Takt aus der Audi-Schnittstelle und legt sie ab. Oberfläche und Miniserver lesen nur das Abgelegte — sie sprechen nie selbst mit dem Anbieter."
DIENST_RESTART = "Dienst neu gestartet:"
DIENST_START = "Dienst gestartet:"
DIENST_STOP = "Dienst angehalten:"
DROSSEL_ERKLAERUNG = "<b>Diese drei Werte schützen Ihr myAudi-Konto.</b> Audi drosselt ein Konto, das zu viele Anfragen stellt, und sperrt es im schlimmsten Fall für 24 Stunden. Ein flatternder Baustein in Loxone — ein Impulsgeber am falschen Eingang genügt — könnte sonst jede Sekunde einen Abruf oder einen Befehl auslösen. Abgewiesene Befehle werden ausdrücklich mit Grund beantwortet, nicht stillschweigend verworfen: wer nicht erfährt, dass sein Befehl nicht ausgeführt wurde, drückt noch einmal."
FEHLER_BEREICH = "%s: der Wert muss zwischen %d und %d liegen."
FEHLER_EMAIL = "Der Benutzername sieht nicht wie eine E-Mail-Adresse aus."
FEHLER_HEIM_HALB = "Für die Heimatposition braucht es Breite <b>und</b> Länge. Mit nur einer der beiden Zahlen entsteht kein Punkt, und der Wert ZUHAUSE bliebe für immer leer."
FEHLER_PRAEFIX = "Das Präfix des Abfahrtsassistenten enthält unerlaubte Zeichen. Erlaubt sind Buchstaben, Ziffern, Bindestrich, Unterstrich und Schrägstrich."
FEHLER_SPEICHERN = "Die Konfiguration ließ sich nicht schreiben: %s"
FEHLER_SPIN = "Die S-PIN besteht aus genau vier Ziffern. Der eingegebene Wert passt nicht in dieses Muster und wurde nicht gespeichert."
FEHLER_TEMP_TAUSCH = "Die kleinste Zieltemperatur ist größer als die größte. Bitte die beiden Werte tauschen."
FEHLER_THEMA = "Das Thema für die Ladeempfehlung enthält unerlaubte Zeichen."
FEHLER_THEMA_LEER = "Die Ladeempfehlung ist eingeschaltet, aber es ist kein Thema angegeben. Ohne Thema entsteht nie ein Wert."
FEHLER_TOPIC = "Das Themenpräfix enthält unerlaubte Zeichen. Erlaubt sind Buchstaben, Ziffern, Bindestrich, Unterstrich und Schrägstrich."
FEHLER_ZAHL = "%s: bitte eine ganze Zahl eintragen."
FEHLER_ZUGANG_SPEICHERN = "Die Zugangsdatei ließ sich nicht schreiben. Rechte des Konfigurationsordners prüfen."
GEFAHR_ERKLAERUNG = "<b>Ver- und Entriegeln, Hupe und Lichthupe sind noch einmal eigens gesperrt.</b> Sie wirken auf ein Fahrzeug, das im öffentlichen Raum steht: ein versehentliches Entriegeln lässt es offen stehen, ohne dass es jemand merkt, und eine Hupe um drei Uhr nachts weckt die Nachbarschaft. Der allgemeine Steuerungshaken darüber genügt dafür nicht — es braucht diesen zweiten. <b>Ver- und Entriegeln verlangt außerdem die S-PIN</b>, sonst weist der Connector den Befehl ab. Beides ist an keinem Fahrzeug erprobt worden."
GERECHNET_ERKLAERUNG = "Diese Angaben stehen in keinem Fahrzeug — das Plugin rechnet daraus selbst weitere Werte aus. <b>Fehlt eine Zutat, entsteht kein Wert</b> und ganz gewiss keine 0: eine 0 wäre eine Aussage, die niemand getroffen hat."
GESPEICHERT = "Die Einstellungen wurden gespeichert."
HORCHER_AUS = "nicht mit dem Broker verbunden"
HORCHER_ZUSTAND = "Zustand des Mithörers:"
H_ABFAHRT = "Vorklimatisierung am Abfahrtsassistenten"
H_ABFAHRT_ALTER = "Wie alt darf die letzte Nachricht des Assistenten höchstens sein, damit sie noch gilt? Danach wird nicht mehr ausgelöst — ein stummes Plugin darf nicht dazu führen, dass irgendwann grundlos geheizt wird."
H_ABFAHRT_FAHRZEUG = "Bei mehreren Fahrzeugen im Konto: welches soll vorklimatisiert werden?"
H_ABFAHRT_PRAEFIX = "Dasselbe Präfix, das im Abfahrtsassistenten eingestellt ist. Ab Werk <span class='sm-mono'>abfahrt</span>. Abonniert werden daraus <span class='sm-mono'>…/ABFAHRT_IN</span> und <span class='sm-mono'>…/OK</span>."
H_ABFAHRT_VORLAUF = "So viele Minuten vor der Abfahrt wird die Klimatisierung gestartet. Ausgelöst wird höchstens einmal je Abfahrt."
H_ABRUF_ABSTAND = "Kürzester Abstand zwischen zwei Sofortabrufen. Jeder Abruf weckt das Fahrzeug und kostet Ruhestrom. 0 schaltet die Bremse ab — davon ist abzuraten."
H_BEFEHLE_STUNDE = "Höchstzahl schaltender Befehle je Stunde. Ist sie erreicht, werden weitere abgewiesen, bis wieder Platz ist. 0 bedeutet: keine Grenze."
H_DATENSCHUTZ = "Datenschutz und Zugang"
H_DIENST = "Abrufdienst"
