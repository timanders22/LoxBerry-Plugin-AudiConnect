THEMEN_ERKLAERUNG = "Die Spalte <i>retained</i> sagt, ob der Broker den letzten Wert aufbewahrt. Das gilt für die Zustände des Fahrzeugs – Verriegelung, Türen, Fenster, Laden, Kilometerstand und die übrigen mit <i>ja</i> –, damit Loxone sie nach einem Neustart sofort hat. Messwerte mit Zeitbezug, Position, Fertigzeitpunkte und die Aussagen des Dienstes über sich selbst gehen nie retained hinaus. Hat ein Zustand keine Aussage, geht er als <span class='sm-mono'>-</span> hinaus; ein Messwert ohne Aussage geht als <span class='sm-mono'>-1</span> hinaus (Temperaturen <span class='sm-mono'>-999</span>), damit in Loxone kein alter Wert gemessen aussieht – Breite, Länge und die Tage bis zur Wartung gehen ohne Aussage gar nicht hinaus, weil dort -1 ein echter Wert ist. <span class='sm-mono'>status/ts</span> und <span class='sm-mono'>status/zaehler</span> sind das Lebenszeichen und kommen bei jedem Durchgang."
