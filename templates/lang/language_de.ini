KONTO_ERKLAERUNG = "Es sind die Zugangsdaten des <b>myAudi-Kontos</b> — dieselben, mit denen Sie sich in der myAudi-App anmelden. Nicht die eines Händlerportals. Sie werden in einer eigenen Datei mit den Rechten 0600 abgelegt, nicht in der Konfiguration, die diese Seite anzeigt. <b>Zwei Hinweise:</b> Der Connector spricht mit dem <b>europäischen</b> Dienst. Und einzelne Konten verlangen eine Zwei-Faktor-Bestätigung; die lässt sich nicht automatisieren. Wer davon betroffen ist, meldet sich einmal im Browser auf diesem Gerät an."
