T_UDP = "UDP-Eingangsport"
V2_ERKLAERUNG = "Unter <b>MQTT-Gateway V2</b> kommt am Miniserver nur an, was in den <i>Subscriptions</i> des Gateways angehakt ist. Diese Tabelle ist die Liste dafür – Thema, Name des virtuellen Eingangs in Loxone und ob <i>Noncached</i> gesetzt sein muss (beim Lebenszeichen und bei „ok“, sonst sendet V2 einen gleichbleibenden Wert nach einem Neustart des Miniservers nicht neu). Texte (Fahrgestellnummer, Adresse, Klartexte) stehen absichtlich nicht darin. Die Zeile im Reiter <i>Test</i> prüft, ob alles angehakt ist."

