S1_TEXT = "Es gibt zwei Wege, und <b>MQTT ist der Regelweg</b>. Der Gateway erzeugt die Namen der virtuellen Eingänge selbst; in Loxone genügt dann ein passend benannter virtueller Eingang. Der Weg über HTTP verlangt je Wert eine eigene Befehlserkennung, dafür kommt alles in <b>einem</b> Abruf und man sieht im Browser sofort, was ankommt. Wer neu anfängt, nimmt MQTT; wer nur wenige Werte braucht, fährt mit HTTP schneller ans Ziel. Beides gleichzeitig geht auch."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Nur nötig, wenn Sie den MQTT-Weg gehen. Unter <i>System → MQTT Gateway</i> im Abschnitt <i>Subscriptions</i> eintragen:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die häufigste Fehlerursache überhaupt — das Plugin sendet, aber niemand hört zu."
S3_ADRESSE_ZEILE = "Der Standort-Abruf liefert eine <b>zweite Zeile</b> mit der Anschrift im Klartext. Sie ist für eine Textanzeige gedacht, nicht für eine Befehlserkennung; die erste Zeile besteht bewusst nur aus Zahlen."
S3_STRICH = "<b>Ein Strich statt einer Zahl bedeutet: dieser Wert liegt nicht vor.</b> Es wird bewusst keine 0 gesendet — eine 0 wäre eine stille Falschaussage. Loxone behält in diesem Fall den letzten gültigen Wert. Genau deshalb braucht es die Ausfallerkennung aus Schritt 7. Felder, die in der Spalte <i>Herkunft</i> mit <i>bleibt leer</i> gekennzeichnet sind, liefert der Audi-Connector überhaupt nicht — sie stehen der Vollständigkeit halber da."
S3_TEXT = "In Loxone Config: <i>Virtueller Eingang → Virtueller HTTP-Eingang</i>. Für jeden der vier Abrufe ein eigener Eingang. Der Knopf unter jeder Tabelle erzeugt die fertige Importdatei — das ist weniger mühsam und weniger fehleranfällig als das Abtippen. Die Tabelle bleibt trotzdem stehen: sie erklärt, was importiert wird. Der Lade-Eingang bleibt bei einem reinen Verbrenner leer; dort stehen dann überall Striche, und das ist richtig so."
S3_TITEL = "Schritt 3: Virtuelle HTTP-Eingänge anlegen"
S4_TEXT = "Zahlen kann Loxone gut, Klartext nicht. Der Abruf <span class='sm-mono'>text</span> liefert deshalb je Zeile einen lesbaren Wert: welchen Zustand das Fahrzeug meldet, ob die Klimatisierung heizt oder kühlt, <b>welche</b> Tür offen steht, die Anschrift und den Namen der Ladesäule. Dafür in Loxone Config einen <i>Virtuellen Texteingang</i> anlegen und je Zeile eine Befehlserkennung nach dem Muster <span class='sm-mono'>\iTUEREN=\i\t</span> — Name, Gleichheitszeichen, Rest der Zeile als Text. Anders als bei den Zahlenzeilen steht hier <b>kein</b> Semikolon davor: jeder Wert hat eine eigene Zeile, und keiner der elf Namen ist das Endstück eines anderen."
S4_TITEL = "Schritt 4: Klartexte für die App (virtueller Texteingang)"
S5_TEXT = "Nur nötig, wenn Loxone etwas auslösen soll. Der Knopf unten erzeugt einen fertigen virtuellen Ausgang samt aller Befehle — bis 0.9.7 musste man sie einzeln abtippen, jede Zeile mit einem 24-stelligen Token darin. Im Befehlstext steht <span class='sm-mono'>&lt;v&gt;</span> für den übergebenen Wert. <b>Achtung: hier steht das Schalttoken</b>, nicht das Lesetoken."
S5_TITEL = "Schritt 5: Befehle senden (virtueller Ausgang)"
S5_WARNUNG = "Drei Dinge, die man vorher wissen sollte. <b>Erstens:</b> Schreibende Befehle sind ab Werk gesperrt und müssen im Reiter Einstellungen erst freigegeben werden; Ver- und Entriegeln, Hupe und Lichthupe brauchen zusätzlich den zweiten Haken und erscheinen sonst gar nicht erst in der Vorlage. <b>Zweitens:</b> Eine Antwort mit <span class='sm-mono'>OK=1</span> heißt, dass der Audi-Server den Auftrag mit HTTP 200 entgegengenommen hat. Ob das Fahrzeug ihn ausführt, zeigt erst der nächste Abruf — wer sicher sein will, wertet den zurückgelesenen Zustand aus und nicht die Antwort auf den Befehl. <b>Drittens:</b> Die Drosselung weist zu dichte Befehle ab. Das ist Absicht und schützt Ihr Konto; der Grund steht in der Antwort."
S6_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Geschützt ist er durch diese beiden Token. <b>Warum zwei?</b> Das Lesetoken steht in jeder Adresse eines virtuellen Eingangs und damit in jeder Loxone-Projektdatei, die weitergegeben wird. Bis 0.9.7 konnte man mit genau diesem Token auch die Klimatisierung starten. Schaltende Aufrufe verlangen jetzt das Schalttoken; lesende nehmen beide an. <b>Ein neues Token macht alle betroffenen Adressen auf einen Schlag ungültig</b> und muss überall nachgetragen werden. Würfeln Sie also nur neu, was tatsächlich in falsche Hände geraten ist."
S6_TITEL = "Schritt 6: Die beiden Token"
S7_TEXT = "Schweigt die Cloud, behalten die virtuellen Eingänge ihren letzten Wert. In der App sieht dann alles normal aus, obwohl seit Stunden nichts mehr angekommen ist. Deshalb wird der Wert <span class='sm-mono'>ALTER</span> mitgeführt: er sagt, wie alt das Abbild in Sekunden ist. Die Schwelle dafür gehört <b>deutlich über den Abholtakt</b> — bei 300 Sekunden Takt sind 900 Sekunden ein brauchbarer Wert, dann löst ein einzelner verpasster Durchlauf noch keine Meldung aus. Zusätzlich gibt es seit 0.9.8 <span class='sm-mono'>FEHLFOLGE</span> (wie viele Abrufe hintereinander schiefgingen) und <span class='sm-mono'>GRUND</span> (warum). Damit lässt sich eine vorübergehende Störung bei Audi von einer Kontosperre unterscheiden, ohne in die Logdatei zu sehen."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_ERLAEUTERUNG = "<p><b>Zu #13 bis #16:</b> Die Meldung über ein offenes Fahrzeug läuft über ein ODER und eine Einschaltverzögerung. Beides ist Absicht. Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein; hängt man mehrere Quellen direkt an seinen Eingang, verschluckt eine dauerhaft aktive Quelle alle übrigen. Die Verzögerung von fünf Minuten verhindert eine Meldung, während man gerade einlädt.</p><p><b>Zu #17 und #18:</b> Zwei getrennte Schwellwertschalter, weil ein Fahrzeug entweder einen Ladezustand oder einen Tankfüllstand liefert — bei einem Hybrid beides. Der jeweils nicht gelieferte Wert bleibt ein Strich; der zugehörige Schalter behält dann seinen letzten Zustand und schaltet nicht.</p><p><b>Zu #21 und #22:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein — genau deshalb ist er hier richtig: Sie bekommen eine Meldung, wenn das Ladekabel eingesteckt wird, und nicht dauernd, solange es steckt. Wer lieber die umgekehrte Meldung will, setzt ein NICHT davor.</p><p><b>Zu #23:</b> Die Inspektionsmeldung braucht den Eingang aus dem Wartungs-Abruf, nicht den aus dem Status-Abruf.</p><p><b>Zu #25:</b> Die Schwelle für die Ausfallerkennung liegt bewusst beim Dreifachen des Abholtakts. Wer sie knapper setzt, bekommt bei jedem einzelnen verpassten Durchlauf eine Meldung.</p><p><b>Zu #28 bis #33:</b> Die Vorheizung ist optional. Die Wochenuhr gibt die gewünschte Abfahrtszeit vor, die UND-Verknüpfung mit der Anwesenheit verhindert das Heizen, während Sie im Urlaub sind, und der Impulsgeber sorgt dafür, dass der Befehl einmal ausgelöst und nicht dauerhaft gesendet wird. <b>Wer das Plugin Abfahrtsassistent einsetzt, braucht #28 bis #33 nicht:</b> dann übernimmt Audi Connect die Vorklimatisierung selbst, siehe Reiter Einstellungen. <b>Loxone-Zeitrechnung:</b> Sekunden seit dem 01.01.2009. Liefert ein Zeit-Baustein Unix-Zeit (Werte um 1,23 Milliarden), sind 1230768000 abzuziehen.</p><p><b>Zu #34:</b> Optional, aber nützlich: ein Befehl, der die Klimatisierung von Hand wieder ausschaltet. Ohne ihn läuft sie bis zum eigenen Zeitablauf weiter.</p><p><b>Zu #35 bis #39 — Überschuss- oder Preisladen:</b> ZUHAUSE kommt aus der Heimatposition, die im Reiter Einstellungen hinterlegt wird; LADEEMPF aus dem dort eingestellten fremden MQTT-Thema. Beide bleiben leer, solange die jeweilige Zutat fehlt — dann schaltet das UND nicht, und das ist richtig so. <b>Wichtig:</b> Der Ladestrom hat eine Entprellung; ein Regler, der im Sekundentakt neue Sollwerte schickt, wird abgewiesen, und der Grund steht in der Antwort.</p><p><b>Zu #40 und #41:</b> FEHLFOLGE zählt, wie viele Abrufe hintereinander schiefgegangen sind. Drei in Folge bedeuten bei einem Takt von 300 Sekunden eine Viertelstunde ohne Verbindung — das ist die Schwelle, ab der es sich zu melden lohnt.</p><p><b>Zu #14 — warum dort vier Quellen an zwei Eingängen hängen:</b> Bei UND und ODER ist die Zahl der Eingänge eine Eigenschaft des Bausteins, die Loxone Config selbst setzt. Zieht man einen dritten Eingang auf, öffnet Config die Datei beim nächsten Mal ohne jede Meldung, entfernt den Eingang wieder — und löscht dabei alle Verbindungen, die daran hingen. Erlaubt ist dagegen, an <i>einen</i> Eingang mehrere Quellen zu hängen; sie werden ODER-verknüpft. An einem ODER ist das dasselbe Ergebnis mit zwei Eingängen. <b>An einem UND wäre es falsch</b>: dort werden mehrere Quellen an einem Eingang ebenfalls ODER-verknüpft, und damit wird aus dem UND ein ODER, ohne dass es irgendetwas meldet. Bei #30 und #38 hängt deshalb an jedem Eingang genau eine Quelle.</p>"
S8_TEXT = "Jede Zeile ein Baustein. Loxone Config führt alle in der Baustein-Suche (Taste F5). Die Zeilen 1 bis 12 und 35 bis 37 sind virtuelle Eingänge aus Schritt 3 — wer die Vorlagen geladen hat, findet sie bereits im Baum."
S8_TITEL = "Schritt 8: Komplette Baustein-Liste zum 1:1-Nachbauen"
S9_TEXT = "Diese vier Adressen im Browser aufrufen. Die erste muss Werte liefern, die drei anderen müssen <b>abgewiesen</b> werden — wenn nicht, ist etwas an der Absicherung falsch. Die letzte ist die Gegenprobe auf die Trennung der beiden Token."
S9_TITEL = "Schritt 9: Gegenprobe"
TOKEN_NEU = "Es wurde ein neues Token erzeugt. Alle bisher im Miniserver eingetragenen Adressen, die es enthalten, sind damit ungültig und müssen nachgetragen werden."
