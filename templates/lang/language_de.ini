ABO_SCHRITTE = "Die Themengruppe dieses Plugins lautet:"
ABO_UNBEKANNT = "Welche Fassung Ihr MQTT&#8209;Gateway hat, ließ sich nicht feststellen. <b>Fassung&nbsp;1:</b> das Plugin bringt sein Abo in der Datei <span class='sm-mono'>mqtt_subscriptions.cfg</span> im eigenen Konfigurationsordner mit, und das Gateway liest sie; kommt am Miniserver trotzdem nichts an, die Zeile zusätzlich unter <i>System → MQTT Gateway</i> in den Abschnitt <i>Subscriptions</i> eintragen. <b>Fassung&nbsp;2 und neuer:</b> die Themengruppe erscheint von selbst in den Subscriptions, einzutragen ist nichts."
ABO_V2 = "<b>MQTT&#8209;Gateway V2 erkennt die Themengruppe von selbst</b> — einzutragen ist hier nichts. In den <i>Subscriptions</i> erscheint die Gruppe; dort werden die gewünschten Datenpunkte einzeln angehakt. Erscheint sie nicht, hat noch nichts veröffentlicht."
ABO_WARNUNG = "<b>Das Plugin bringt sein Abo selbst mit:</b> die Datei <span class='sm-mono'>mqtt_subscriptions.cfg</span> im Konfigurationsordner des Plugins trägt die Themengruppe, und das MQTT&#8209;Gateway V1 liest sie. Sie folgt dem Präfix, sobald es gespeichert ist. Kommt am Miniserver trotzdem nichts an, die Zeile zusätzlich unter <i>System → MQTT Gateway</i> in den Abschnitt <i>Subscriptions</i> eintragen und speichern."
AUTOSTART_AUS = "Der Gateway ist <b>nicht</b> auf Autostart gestellt. Der Broker-Eintrag allein genügt nicht — er ist ab Werk gesetzt und sagt nichts darüber aus, ob Nachrichten ankommen können. Maßgeblich ist der Autostart unter <i>System → MQTT Gateway</i>."
