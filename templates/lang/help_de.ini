; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Audi Connect"
K02 = "Bindet Audi-Fahrzeuge über das myAudi-Konto an Loxone an: Ladezustand, Tankfüllstand, Reichweite, Kilometerstand, Verriegelung, Türen und Fenster (auch, <i>welche</i> offen stehen), Licht, Fahrzeugzustand, Klimatisierung samt Zonen, Scheibenheizung, Ladewerte, Batterietemperatur, Standort sowie Inspektions- und Ölservice-Fristen. Auf Wunsch lassen sich Klimatisierung, Ladevorgang, Ladegrenze, Ladestrom, Scheibenheizung und neun Fahrzeugeinstellungen schalten — und, eigens freizugeben, Ver- und Entriegeln, Hupe und Lichthupe."
K03 = "Es arbeitet mit allen vernetzten Audi: e-tron, Hybride und Verbrenner. Beim Verbrenner bleiben die elektrischen Werte leer, beim Plug-in-Hybrid führt das Plugin beide Antriebe getrennt."
K04 = "Der Vorbehalt zu dieser Fassung"
K05 = "Das Plugin baut auf zwei Bibliotheken mit <b>unterschiedlicher Herkunft</b>:"
K06 = "<i>carconnectivity</i> — das Gerüst, von Till Steinbach, seit Jahren gepflegt, Fassung 0.11.10"
K07 = "<i>carconnectivity-connector-audi</i> — der Audi-Teil, von Achim Fischer auf diesem Gerüst aufgebaut. Erste Fassung 28.09.2025, aktuell 0.3.2, insgesamt acht Veröffentlichungen"
K08 = "Zum Vergleich: der Volkswagen-Connector desselben Gerüsts steht bei 0.10.6. Technisch ist der Audi-Teil weitgehend baugleich — dieselben Befehlsklassen, dieselbe Untergrenze von 180&nbsp;Sekunden. Er ist nur jünger und weniger erprobt. Deshalb sind hier <b>beide</b> Fassungen festgenagelt: ein stillschweigendes Update könnte mehr verändern als anderswo."
K09 = "Zwei Grenzen"
K10 = "<b>Europa.</b> Der Connector spricht mit dem europäischen Dienst."
K11 = "<b>Zwei-Faktor-Bestätigung.</b> Einzelne Konten verlangen sie beim Anmelden. Das lässt sich nicht automatisieren; wer davon betroffen ist, meldet sich einmal im Browser auf demselben Gerät an."
K12 = "Abholtakt: mindestens 180 Sekunden"
K13 = "Das ist keine Vorsicht dieses Plugins, sondern die Untergrenze der Bibliothek — darunter nimmt sie die Einstellung gar nicht erst an. Fünf Minuten sind ein guter Anfang. Wird ein Wert sofort gebraucht, ist der Abruf-Befehl der richtige Weg, nicht ein kürzerer Takt."
K14 = "Zugangsdaten"
K15 = "Es sind die Zugangsdaten des <b>myAudi-Kontos</b> — dieselben wie in der myAudi-App. Sie liegen in einer eigenen Datei mit den Rechten 0600 und stehen nie in der Loxone-Projektdatei. Das Passwort wird nirgends angezeigt; im Reiter <i>Test</i> steht nur seine Länge. Die S-PIN wird ausschließlich für Ver- und Entriegeln gebraucht."
K16 = "Nach der ersten Anmeldung legt die Bibliothek Anmeldemarken ab und meldet sich damit an, statt jedes Mal das Passwort zu senden. Nach einem Passwortwechsel sind sie wertlos — dafür gibt es im Reiter <i>Einstellungen</i> den Knopf <i>Anmeldung neu erzwingen</i>. Lehnt Audi die Anmeldung fünfmal hintereinander ab, meldet sich der Dienst nicht mehr an und sagt <i>Anmeldung abgelehnt, Zugangsdaten prüfen</i>, bis E-Mail oder Passwort geändert sind – so sperrt Audi das Konto nicht."
K17 = "So gehen Sie vor"
K18 = "<b>Einstellungen:</b> Benutzername und Passwort eintragen, speichern, dann <i>Dienst starten</i>."
K19 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt. Jedes Kreuz nennt die Abhilfe mit. Ein grauer Punkt ist ein Hinweis, kein Mangel."
K20 = "<b>MQTT:</b> Das Plugin bringt sein Abo in der Datei <i>mqtt_subscriptions.cfg</i> selbst mit; das MQTT&#8209;Gateway&nbsp;V1 liest sie, und sie folgt dem Präfix, sobald es gespeichert ist. Kommt am Miniserver trotzdem nichts an, das Abo zusätzlich im MQTT-Gateway eintragen. Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions."
K21 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit fertigen Importdateien für jeden Abruf und für die Befehle — und mit vollständiger Baustein-Liste zum Nachbauen."
K22 = "Steuerung — zwei Haken, nicht einer"
K23 = "Schreibende Befehle sind ab Werk <b>gesperrt</b>. Ver- und Entriegeln, Hupe und Lichthupe hängen an einem <b>zweiten</b> Haken, der zusätzlich gesetzt sein muss: sie wirken auf ein Fahrzeug, das im öffentlichen Raum steht, und beides ist an keinem Fahrzeug erprobt. Wer die Kette prüfen will, ohne das Auto anzufassen, setzt den <i>Probelauf</i> — dann wird jeder Befehl vollständig geprüft und nichts gesendet. Wichtig: eine Antwort mit <i>OK=1</i> heißt, dass der Audi-Server den Auftrag entgegengenommen hat — ob das Fahrzeug ihn ausführt, zeigt erst der nächste Abruf."
K24 = "Was ungeprüft ist"
K25 = "Dieses Plugin wurde ohne myAudi-Konto und ohne Fahrzeug gebaut. Ungeprüft ist deshalb, ob die Anmeldung gelingt, ob ein bestimmtes Fahrzeug alle abgefragten Werte liefert und ob die schreibenden Befehle die erwartete Wirkung haben. Die Zuordnung der Werte und die Befehle sind dagegen gegen den Quelltext der festgenagelten Bibliotheksfassung gemessen. Bleibt ein Wert leer, zeigt der Knopf <i>Rohdaten als JSON ansehen</i> im Reiter <i>Test</i>, was der Dienst tatsächlich bekommen hat."
K26 = "Grundlage"
K27 = "Die Anbindung nutzt <i>carconnectivity</i> von Till Steinbach und <i>carconnectivity-connector-audi</i> von Achim Fischer (beide MIT). Sie sind keine amtliche Audi-Schnittstelle und können sich jederzeit ändern."
K28 = "Sieben Werte, die dauerhaft leer bleiben"
K29 = "Am Quelltext des Audi-Connectors 0.3.2 nachgemessen — nicht vermutet: <b>Kennzeichen, Baujahr, Softwarestand, Handbremse, Batteriekapazität und Ölstand</b> füllt er an keiner Stelle. (Bis 0.9.11 stand der <i>Hersteller</i> hier mit in der Aufzählung — den füllt er sehr wohl.) Das Kernmodell der Bibliothek kennt diese Felder, der Audi-Teil bedient sie nicht. Das Plugin fragt sie weiterhin ab — eine spätere Connector-Fassung kann sie liefern — und kennzeichnet sie überall als <i>bleibt leer</i>, statt eine erfundene Zahl zu senden. Die Batteriekapazität lässt sich im Reiter <i>Einstellungen</i> von Hand hinterlegen; sie wird für Verbrauch und geladene Menge gebraucht."
K30 = "Drosselung — der Schutz Ihres Kontos"
K31 = "Audi drosselt ein Konto, das zu viele Anfragen stellt, und sperrt es im schlimmsten Fall für 24 Stunden. Drei Bremsen verhindern das: ein Mindestabstand für Sofortabrufe, eine Obergrenze für schaltende Befehle je Stunde und eine Entprellung für Änderungen des Ladestroms. Die letzte ist für das Überschussladen wichtig — ein Regler in Loxone liefert alle paar Sekunden einen neuen Sollwert, und jeder davon wäre eine Anfrage. Abgewiesen wird immer <b>mit Grund</b>; ein stillschweigend verworfener Befehl führt nur dazu, dass man noch einmal drückt. Dazu kommt: derselbe Sollwert – Klimatisierung, Laden, Ver- und Entriegeln, Scheibenheizung, Zieltemperatur, Ladegrenze, Fahrzeugeinstellungen – geht innerhalb von 60&nbsp;Sekunden nur einmal an Audi; ein zweiter gleicher Aufruf bekommt <i>UNVERAENDERT=1</i>, und gesendet wird nichts."
K32 = "Automatik: Vorklimatisierung und Ladeempfehlung"
K33 = "Läuft das Plugin <i>Abfahrtsassistent</i> auf demselben LoxBerry, kann Audi Connect die Klimatisierung selbst starten — so viele Minuten vor der Abfahrt, wie eingestellt. Und aus einem beliebigen fremden MQTT-Thema — etwa dem Börsenstrompreis oder einem PV-Überschuss — bildet das Plugin eine Ladeempfehlung, die als Zahl nach Loxone geht. <b>Entschieden wird in Loxone</b>, nicht hier: dort steht auch alles andere. Beides ist ab Werk aus und braucht das Python-Modul paho-mqtt. Die Installation holt es, <b>wenn eine Internetverbindung besteht</b> — schlägt das fehl, läuft das Plugin trotzdem, und nur diese beiden Zusatzfunktionen bleiben wirkungslos. Der Reiter <i>Test</i> sagt, ob das Modul da ist. Das Thema der Ladeempfehlung besteht aus Buchstaben, Ziffern, Punkt, Bindestrich und Unterstrich, Ebenen getrennt durch einen Schrägstrich – Platzhalter wie + oder # gehen nicht, gebraucht wird genau ein Wert."
K34 = "Gerechnete Größen und das Ladeprotokoll"
K36 = "Was OK sagt"
K37 = "<b>OK=1</b> heißt: das Abbild ist gültig, also höchstens dreimal so alt wie der Takt. Ist es älter – der Dienst steht, hängt oder kommt seit Langem nicht an Audi heran –, meldet der Endpunkt <b>OK=0</b>; ALTER steht unverändert daneben, und GRUND nennt die Ursache (10 = Abbild zu alt). Ein einzelner misslungener Abruf setzt OK nicht auf 0: das Abbild ist dann noch brauchbar, und GRUND sagt, was schiefging."
K38 = "MQTT: retained und Lebenszeichen"
K39 = "Die Zustände des Fahrzeugs – Verriegelung, Türen, Fenster, Ladekabel, Ladegrenze, Modell, Kilometerstand und die übrigen, die im Reiter <i>MQTT</i> als <i>retained</i> stehen – gehen <b>retained</b> hinaus, damit Loxone sie nach einem Neustart sofort hat. Messwerte mit Zeitbezug, Position, Fertigzeitpunkte und die Aussagen des Dienstes über sich selbst nie. Ein Zustand ohne Aussage geht als <i>-</i> hinaus. <i>status/ts</i> und <i>status/zaehler</i> sind das Lebenszeichen, bei jedem Durchgang. Beim Wechsel des Präfixes, beim Ausschalten von MQTT, für ein entferntes Fahrzeug und bei der Deinstallation räumt das Plugin seine zurückbehaltenen Themen am Broker ab."
K35 = "Aus vorhandenen Werten rechnet das Plugin weitere aus, ohne Audi dafür etwas Zusätzliches zu fragen: <i>zu Hause</i> und die Entfernung dorthin aus einer hinterlegten Heimatposition, den Verbrauch des letzten Fahrabschnitts und die geladene Menge aus der hinterlegten Batteriekapazität, die Standzeit und die Zahl der Fehlversuche in Folge. Jeder abgeschlossene Ladevorgang wird außerdem protokolliert und steht im eigenen Reiter <i>Ladevorgänge</i>. <b>Fehlt eine Zutat, entsteht kein Wert</b> — und ganz gewiss keine 0."
