; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Audi Connect"
K02 = "Bindet Audi-Fahrzeuge über das myAudi-Konto an Loxone an: Ladezustand, Tankfüllstand, Reichweite, Kilometerstand, Verriegelung, Türen und Fenster, Licht, Handbremse, Fahrzeugzustand, Klimatisierung, Scheibenheizung, Ladewerte, Standort sowie Inspektions- und Ölservice-Fristen. Auf Wunsch lassen sich Klimatisierung, Ladevorgang, Ladegrenze, Ladestrom und Scheibenheizung schalten."
K03 = "Es arbeitet mit allen vernetzten Audi: e-tron, Hybride und Verbrenner. Beim Verbrenner bleiben die elektrischen Werte leer, beim Plug-in-Hybrid führt das Plugin beide Antriebe."
K04 = "Der Vorbehalt zu dieser Fassung"
K05 = "Das Plugin baut auf zwei Bibliotheken mit <b>unterschiedlicher Herkunft</b>:"
K06 = "<i>carconnectivity</i> — das Gerüst, von Till Steinbach, seit Jahren gepflegt, Fassung 0.11.10"
K07 = "<i>carconnectivity-connector-audi</i> — der Audi-Teil, von Achim Fischer auf diesem Gerüst aufgebaut. Erste Fassung 28.09.2025, aktuell 0.3.2, insgesamt acht Veröffentlichungen"
K08 = "Zum Vergleich: der Volkswagen-Connector desselben Gerüsts steht bei 0.10.6. Technisch ist der Audi-Teil baugleich — dieselben Befehlsklassen, dieselben Werte, dieselbe Untergrenze von 180&nbsp;Sekunden. Er ist nur jünger und weniger erprobt. Deshalb sind hier <b>beide</b> Fassungen festgenagelt: ein stillschweigendes Update könnte mehr verändern als anderswo."
K09 = "Zwei Grenzen"
K10 = "<b>Europa.</b> Der Connector spricht mit dem europäischen Dienst."
K11 = "<b>Zwei-Faktor-Bestätigung.</b> Einzelne Konten verlangen sie beim Anmelden. Das lässt sich nicht automatisieren; wer davon betroffen ist, meldet sich einmal im Browser auf demselben Gerät an."
K12 = "Abholtakt: mindestens 180 Sekunden"
K13 = "Das ist keine Vorsicht dieses Plugins, sondern die Untergrenze der Bibliothek — darunter nimmt sie die Einstellung gar nicht erst an. Fünf Minuten sind ein guter Anfang. Wird ein Wert sofort gebraucht, ist der Abruf-Befehl der richtige Weg, nicht ein kürzerer Takt."
K14 = "Zugangsdaten"
K15 = "Es sind die Zugangsdaten des <b>myAudi-Kontos</b> — dieselben wie in der myAudi-App. Sie liegen in einer eigenen Datei mit den Rechten 0600 und stehen nie in der Loxone-Projektdatei. Das Passwort wird nirgends angezeigt; im Reiter <i>Test</i> steht nur seine Länge."
K16 = "Nach der ersten Anmeldung legt die Bibliothek Anmeldemarken ab und meldet sich damit an, statt jedes Mal das Passwort zu senden. Nach einem Passwortwechsel sind sie wertlos — dafür gibt es im Reiter <i>Einstellungen</i> den Knopf <i>Anmeldung neu erzwingen</i>."
K17 = "So gehen Sie vor"
K18 = "<b>Einstellungen:</b> Benutzername und Passwort eintragen, speichern, dann <i>Dienst starten</i>."
K19 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt. Jedes Kreuz nennt die Abhilfe mit."
K20 = "<b>MQTT:</b> Das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an."
K21 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit vollständiger Baustein-Liste zum Nachbauen."
K22 = "Steuerung"
K23 = "Schreibende Befehle sind ab Werk <b>gesperrt</b> und müssen ausdrücklich freigegeben werden. Ver- und Entriegeln sowie Hupe und Lichthupe bietet dieses Plugin bewusst <b>nicht</b> an. Wichtig: eine Antwort mit <i>OK=1</i> heißt, dass der Audi-Server den Auftrag entgegengenommen hat — ob das Fahrzeug ihn ausführt, zeigt erst der nächste Abruf."
K24 = "Was ungeprüft ist"
K25 = "Dieses Plugin wurde ohne myAudi-Konto und ohne Fahrzeug gebaut. Ungeprüft ist deshalb, ob die Anmeldung gelingt, ob ein bestimmtes Fahrzeug alle abgefragten Werte liefert und ob die schreibenden Befehle die erwartete Wirkung haben. Die Zuordnung der Werte selbst ist dagegen gegen echte Objekte der Bibliothek gemessen. Bleibt ein Wert leer, zeigt der Knopf <i>Rohdaten als JSON ansehen</i> im Reiter <i>Test</i>, was der Dienst tatsächlich bekommen hat."
K26 = "Grundlage"
K27 = "Die Anbindung nutzt <i>carconnectivity</i> von Till Steinbach und <i>carconnectivity-connector-audi</i> von Achim Fischer (beide MIT). Sie sind keine amtliche Audi-Schnittstelle und können sich jederzeit ändern."
