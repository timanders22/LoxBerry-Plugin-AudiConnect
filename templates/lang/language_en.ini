UNGEPRUEFT = "This plugin was built <b>without a myAudi account and without a vehicle</b>. Unverified is therefore: whether the sign-in succeeds, whether this vehicle supplies the values queried and whether the writing commands have the expected effect. Everything else is verified — the mapping of the values and the commands have been measured against the <b>source of the library in the pinned version</b>. <b>A second caveat applies here:</b> the Audi connector is considerably younger than the Volkswagen one (first version 28.09.2025, eight releases up to 0.3.2) and has a different maintainer. The framework underneath is the same and mature, the Audi part is not to the same degree. That is why this version carries a 0.9 number and not 1.0.0. If something stays empty, the button <i>View raw data as JSON</i> helps: it shows what the service actually received."

