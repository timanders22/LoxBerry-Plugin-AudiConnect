SITZUNG_ERKLAERUNG = "After the first sign-in the library stores authentication tokens in a separate file with permissions 0600 and signs in with them instead of sending the password every time. That spares Audi's sign-in page, which throttles repeated sign-ins. After a password change the tokens are worthless — then the button <i>Force new sign-in</i> above helps."
