[BAUSTEIN]
HINWEISE_TITEL = "Notes"
S1_H1 = "If the polling service fails or Audi has a longer fault, AUDI_1_OK becomes 0 after three polling intervals (15 minutes by default); the message follows 10 minutes later. If the LoxBerry itself stands still, all values freeze – only the Value Validator no. 16 notices that (after 15 minutes without a new age, message after 25 minutes in total)."
S1_H2 = "On no. 16: on the HTTP path Audi delivers no run counter; the age changes with every poll and serves as the sign of life. If you lengthen the polling interval in the plugin, set Tmc to three times the polling time of the container."
S1_H3 = "On no. 22 and 24: a value the vehicle never delivers (electric car without tank, combustion car without battery) stands at 0 in Loxone – the formulas in front prevent a permanent message. Behind a polled input the threshold switches give a short pulse at every poll; the Switch-On Delay no. 28 swallows it."
S1_H4 = "“Meldung Ladung beendet (Audi)” arrives at every end of charging – also when the cable is unplugged and at every pause of “Laden nach Empfehlung”. If you do not want that, put an AND with negated “Empfehlung hält an (Audi)” (page “AudiConnect Laden”) in front."
S1_H5 = "A second vehicle: fetch the same four templates for vehicle 2 in the tab (the commands are called AUDI_2_…), copy the pages and swap the commands; lead its fault via a further OR before no. 19 – never two sources directly into one notification."
S1_H6 = "With EVCC at your own wallbox the page “EVCC” already reports the finished charge at the charging point; this page also reports on the road. If you have both, leave out one of the two messages."
S1_H7 = "Announcements (“charging finished”, “standing open”, “lights on”, “no data any more”) are spoken by the plugin itself (tab Settings, off by default) – no block. After “%s” renew the address in all four containers."
S1_SCHRITT1 = "In the plugin tab “%s” enter the myAudi e-mail, password and S-PIN, save, “%s”. After a few minutes, in the tab “%s” press “%s” – values arrive."
S1_SCHRITT2 = "Tab “%s”, step 3: fetch the four templates “%s”, “%s”, “%s” and “%s” for vehicle 1 and import them in Loxone Config: select “Virtual Inputs” in the tree, ribbon “Predefined HTTP devices → Import template…”. Import each only ONCE (twice gives duplicate inputs). The containers “Audi 1 STATUS”, “Audi 1 LADEN”, “Audi 1 WARTUNG” and “Audi 1 POSITION” serve all four pages."
S1_SCHRITT3 = "Create the page “AudiConnect”, drag the commands no. 1–12 from “Audi 1 STATUS”, from “Audi 1 LADEN” AUDI_1_LAEDT and AUDI_1_KABEL (no. 13 and 14), plus the constant 1 (no. 15). Caution: AUDI_1_OK, AUDI_1_ALTER, AUDI_1_GRUND and AUDI_1_SOC exist in several containers – take the one from the container named. Switch on “Statistics” at AUDI_1_SOC and AUDI_1_REICHW."
S1_SCHRITT4 = "Create three notifications (Periphery → Messages → Notification): “Meldung Auto gestört (Audi)”, “Meldung Ladestand niedrig (Audi)” and “Meldung Ladung beendet (Audi)”, texts as in the list, drag them onto the page. Each gets exactly one connection (from no. 19, from no. 28 and from output Off of no. 32)."
S1_SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect from top to bottom; every AND and OR has two inputs. On the Value Validator no. 16 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0 and the message never triggers). AND no. 27: negate input I2 – click its input point in Config; the input then shows a small circle. Status “Zustand (Audi)” and “Ladestand und Reichweite (Audi)”: click “+” four times on each first (V5–V8); enter the rows in the given order, the one without condition last. “Use in User Interface” on both status blocks."
S1_SCHRITT6 = "Save and transfer. Check: “Zustand (Audi)” shows “running – values … s old”. In Config make sure that the input of the Edge Detection no. 32 hangs on no. 31 and the notification on output Off."
S2_H1 = "A combustion car leaves the charging values empty (dash) – it does not need this page."
S2_H2 = "With EVCC or another wallbox control leave “Laden nach Empfehlung (Audi)” off (or leave out no. 29–35) – the wallbox controls; two controllers fight each other."
S2_H3 = "On no. 31: AUDI_1_ZUHAUSE needs the home position, AUDI_1_LADEEMPF a topic in the plugin; if one is missing, the AND does not switch – that is correct."
S2_H4 = "Every command wakes the vehicle over the mobile network; Audi throttles too many orders, the plugin allows at most 30 per hour and changes the charging current every 5 minutes at most. Do not push the sliders back and forth."
S2_H5 = "The plugin rounds the charge limit to tens; as charging current only 6 A (reduced) and 16 A (maximum) apply to all vehicles."
S2_H6 = "Whether a command works is only shown by the next poll (status “Laden (Audi)”), not by the answer of the plugin."
S2_SCHRITT1 = "The containers “Audi 1 LADEN” and “Audi 1 STATUS” come from the page “AudiConnect”, step 2 (do not import them again). In the plugin tab “%s” under “%s” enter the battery capacity (for consumption and energy charged), plus “%s” with a topic (e.g. exchange price) and the home position (for “at home”)."
S2_SCHRITT2 = "In the plugin tab “%s” set the tick “%s” (off by default – otherwise every command answers STEUERUNG_AUS); do NOT set the second tick “%s”. Tab “%s”, step 5: fetch “Template virtual output — vehicle 1” and import it: tree “Virtual Outputs” → “Predefined devices → Import template…”. The file contains the switch token – do not pass it on. The container “Audi 1 steuern” also serves the page “AudiConnect Klima und Befehle”; if you imported it before version 0.9.28, import it again."
S2_SCHRITT3 = "Create the page “AudiConnect Laden”, drag the commands no. 1–18 from “Audi 1 LADEN” (no. 18 is AUDI_1_SOC from LADEN, not from STATUS), from “Audi 1 STATUS” AUDI_1_ZUHAUSE (no. 30), from “Audi 1 steuern” the commands no. 26, 28 and 36. Switch on “Statistics” at AUDI_1_LADEKW."
S2_SCHRITT4 = "Create the notification “Meldung Ladestörung (Audi)” (text as in the list, one connection from no. 23). Create the virtual inputs: the sliders no. 25 and 27 (limits and start values as in the list) and the switches no. 29 and 34, each with “Use in User Interface” on."
S2_SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect from top to bottom; every AND and OR has two inputs. Status “Laden (Audi)”: click “+” four times first (V5–V8), “Ladetechnik (Audi)” three times (V5–V7). “Use in User Interface” on the three status blocks."
S2_SCHRITT6 = "Save and transfer. Check: plug in the cable – after the next poll “Laden (Audi)” shows “cable plugged in …” or “charging at … kW”."
S3_H1 = "On no. 16 and 17: “AUDI 1 Klimatisierung” is an analogue command with the temperature (<v.1>) and without an off command. At rest the formula delivers -1; the plugin rejects this value without effect. The climatisation only goes off via “Klima aus (Audi)”."
S3_H2 = "Do not push the temperature slider back and forth while the climatisation is running – every change is a new order to Audi (at most 30 per hour)."
S3_H3 = "If you use the departure assistant, you can switch on “%s” in the plugin instead of the schedule and AND (no. 12–14) – then Audi Connect climatises by itself for the departure."
S3_H4 = "The switches of the settings (no. 20–29) only show what was last sent from Loxone; what is set in the vehicle is shown by “Klima (Audi)” and “Ladetechnik (Audi)”."
S3_H5 = "“AUDI 1 Zieltemperatur” and the four climate zones of the template are not in the sample; a climate zone is built like no. 20 and 21: switch → command."
S3_H6 = "Locking and unlocking, horn and headlight flash are deliberately not in the sample: they need the second tick “%s” and do not belong in an app for everybody."
S3_H7 = "“Jetzt abrufen” applies to the whole account (every 60 s at most); use “Fahrzeug wecken” sparingly – every wake-up call goes to the vehicle over the mobile network."
S3_SCHRITT1 = "The containers “Audi 1 STATUS” and “Audi 1 steuern” come from the pages “AudiConnect” and “AudiConnect Laden” (do not import them again); the tick “%s” must be set in the plugin."
S3_SCHRITT2 = "Create the page “AudiConnect Klima und Befehle”, drag the commands no. 1–8 from “Audi 1 STATUS”, from “Audi 1 steuern” the nine commands no. 17, 19, 21, 23, 25, 27, 29, 31 and 33, plus “Anwesenheit (eigene Quelle)” (no. 13) – in your own project take your own presence."
S3_SCHRITT3 = "Create the ten virtual inputs (one slider, four push buttons, five switches), values as in the list, each with “Use in User Interface” on. Place the Schedule no. 12 via the block search (key F5) and enter the switching times Monday to Friday 06:40–07:00 ON (your own departure time minus 20 minutes)."
S3_SCHRITT4 = "Place the remaining blocks via the block search (key F5) and connect from top to bottom; the AND no. 14 hangs on output AQ of the schedule. Status “Klima (Audi)”: click “+” four times first (V5–V8), “Use in User Interface” on."
S3_SCHRITT5 = "Save and transfer. Check: press “Klima jetzt (Audi)” – after the next poll “Klima (Audi)” shows “heating” or “cooling”; “Klima aus (Audi)” stops the climatisation."
S4_H1 = "If you want to save the NOT no. 21: negate input I1 of the OR no. 22 – click the input point in Config; the input then shows a small circle."
S4_H2 = "On no. 25: the open message only comes when the vehicle is parked (0 offline or 1 parked) and the values are valid – while driving the car is often not locked."
S4_H3 = "On no. 29: 0 means “not delivered” (e.g. no oil service for an electric car); an inspection due today does not count therefore, the message already came at 14 days. If you drive a diesel, build the same three blocks for AdBlue."
S4_H4 = "The location is visible in the app for all users with access to this page; if you do not want that, leave out no. 13–15 or switch off “%s” in the plugin."
S4_H5 = "The plugin fetches maintenance values only every hour (setting “%s”)."
S4_H6 = "Plain texts (which door, address, charging station) only exist over MQTT – with MQTT switched on the MQTT gateway creates virtual text inputs such as audi_fahrzeug1_tueren_namen; keep the title exactly like that."
S4_SCHRITT1 = "In the plugin tab “%s” tick “%s” and enter the home position (latitude, longitude, radius) – without it “at home” and the distance stay empty."
S4_SCHRITT2 = "Create the page “AudiConnect Fahrzeug”, drag the commands no. 1–12 from “Audi 1 STATUS”, no. 13–15 from “Audi 1 POSITION” and no. 16–20 from “Audi 1 WARTUNG”. Switch on “Statistics” at AUDI_1_KM."
S4_SCHRITT3 = "Create two notifications: “Meldung Fahrzeug offen (Audi)” and “Meldung Service fällig (Audi)”, texts as in the list; each gets exactly one connection (from no. 27 or no. 31)."
S4_SCHRITT4 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect from top to bottom; every AND and OR has two inputs. Click “+”: “Türen und Fenster (Audi)” four times (V5–V8), “Standort und Kilometer (Audi)” three times (V5–V7), “Wartung (Audi)” twice (V5, V6). “Use in User Interface” on the three status blocks."
S4_SCHRITT5 = "Save and transfer. Check: park the vehicle and do not lock it – after the next poll and 5 minutes “Meldung Fahrzeug offen (Audi)” arrives."
SCHRITTE_TITEL = "How to take over this page"
Z1_01 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_OK | 1 = the values are valid (at most three times as old as the polling interval, 300 s by default), otherwise 0 | —"
Z1_02 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_ALTER | age of the values in seconds – the sign of life: changes with every poll as long as LoxBerry and plugin answer | —"
Z1_03 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_GRUND | fault reason: 0 OK, 1 never polled yet, 2 login rejected, 3 account throttled, 4 Audi not reachable, 5 fault at Audi, 6 no vehicle in the account, 7 credentials missing, 8 setup faulty, 9 unknown, 10 polling service stopped | —"
Z1_04 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_FEHLFOLGE | polls that failed in a row | —"
Z1_05 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_FZOK | 1 = the vehicle has answered all sections | —"
Z1_06 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_AUSFALL | number of sections the vehicle has not answered | —"
Z1_07 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_ERREICH | 1 = the vehicle is reachable for the Audi cloud | —"
Z1_08 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_ZUSTAND | 0 offline, 1 parked, 2 ignition on, 3 driving | —"
Z1_09 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_SOC | state of charge of the traction battery in %%; statistics on | —"
Z1_10 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_TANK | fuel level in %% (combustion and hybrid only; stays 0 for an electric car) | —"
Z1_11 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_REICHW | total range in km; statistics on | —"
Z1_12 = "Virtual HTTP input command (template “Audi 1 STATUS”) | AUDI_1_REICHWVERBR | range from fuel alone in km (hybrid) | —"
Z1_13 = "Virtual HTTP input command (template “Audi 1 LADEN”) | AUDI_1_LAEDT | 1 = charging right now (further instance, also on page “AudiConnect Laden”) | —"
Z1_14 = "Virtual HTTP input command (template “Audi 1 LADEN”) | AUDI_1_KABEL | 1 = charging cable plugged in (further instance, also on page “AudiConnect Laden”) | —"
Z1_15 = "Constant | Konstante 1 | value 1 | —"
Z1_16 = "Value Validator | Lebenszeichen fehlt (Audi) | Tmc 900 s (three times the polling time of 300 s), Min 0, Max 999999 – if the LoxBerry stands still, the age keeps its last value; remove the tick at ‘En’ in the properties window | V = #2, En = #15"
Z1_17 = "NOT | Keine frischen Daten (Audi) | — | I = #1"
Z1_18 = "OR | Störung (Audi) | — (no fresh data or sign of life missing) | I1 = #17, I2 = output E of #16"
Z1_19 = "Switch-On Delay | Störung bestätigt (Audi) | 600 s (two polls; a restart and a single failed poll report nothing) | Input = #18"
Z1_20 = "Notification | Meldung Auto gestört (Audi) | Text: AudiConnect – no valid data from the vehicle for 10 minutes: LoxBerry does not answer, the polling service stands still or Audi has a fault. Read the status “Zustand (Audi)” in the app | Input = #19"
Z1_21 = "Status | Zustand (Audi) | rows: V1 = 1 “sign of life missing for at least 15 minutes – LoxBerry or plugin does not answer; open the LoxBerry in the browser, in the plugin tab Test ‘Fetch immediately’”; V3 = 7 “credentials missing – in the plugin tab Settings enter the myAudi e-mail, password and S-PIN, then ‘Start service’”; V3 = 2 “login at myAudi rejected – check the credentials in the plugin tab Settings”; V3 = 3 “account throttled by Audi – wait; in the plugin increase the interval and do not fetch by hand”; V3 = 6 “no vehicle in the myAudi account – add the vehicle in the myAudi app”; V3 = 8 “setup faulty – read the self-check in the plugin tab Test”; V3 = 10 “polling service stopped – values <v4> s old; in the plugin tab Settings ‘Start service’”; V3 = 1 “not polled yet – in the plugin tab Settings ‘Start service’”; V3 = 4 “Audi not reachable – check the internet connection of the LoxBerry; <v5> failed polls in a row”; V3 = 5 “fault at Audi – wait; <v5> failed polls in a row”; V2 = 0 “no valid values – last state <v4> s old; look at the plugin tab Test”; V8 = 0 “vehicle not reachable for the Audi cloud (underground car park, dead spot, parked for a long time) – values <v4> s old”; V6 = 0 “vehicle has not answered <v7> sections – single values are missing”; without condition “running – values <v4> s old”; visualisation ON | V1 = output E of #16, V2 = #1, V3 = #3, V4 = #2, V5 = #4, V6 = #5, V7 = #6, V8 = #7"
Z1_22 = "Formula | Ladestand für Meldung (Audi) | IF(I1>0;I1;100) – a state of charge never reported (0: combustion car or before the first poll) does not count as low | I1 = #9"
Z1_23 = "Threshold Switch | Ladestand niedrig (Audi) | On 20 / Off 25 (%%; switches on when falling below 20 %%, off again above 25 %%) | Input = #22"
Z1_24 = "Formula | Reichweite für Meldung (Audi) | IF(I1>0;I1;999) – a range never reported (0) does not count as low | I1 = #11"
Z1_25 = "Threshold Switch | Reichweite gering (Audi) | On 50 / Off 70 (km; switches on when falling below 50 km, off again above 70 km) | Input = #24"
Z1_26 = "OR | Ladestand oder Reichweite knapp (Audi) | — | I1 = #23, I2 = #25"
