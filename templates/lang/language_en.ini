H_DROSSEL = "Throttling — protection against an account block"
H_EMAIL = "The e-mail address the myAudi account was created with."
H_ERKANNT = "Detected vehicles"
H_GEFAHR_EIN = "Only tick this if you really want to try the effect on your vehicle. The checkbox above must be ticked as well — this one acts in addition, not instead."
H_GERECHNET = "Computed values"
H_GPS_EIN = "With the box unticked the service does not fetch the location at all. It then appears in no file, no MQTT topic and no answer to the Miniserver — the values ZUHAUSE and ENTF are no longer produced either."
H_HEIM = "Home position and radius. If the vehicle is closer than the radius, ZUHAUSE = 1. You will find the coordinates in any map application; three decimal places are about a hundred metres, five are about one metre."
H_INTERVALL = "Gap between two fetches. Allowed are 180 to 3600 seconds — 180 is the library's lower limit, not a precaution of this plugin."
H_KAPAZITAET = "Usable capacity of the traction battery in kWh. The Audi connector does not supply it (measured), which is why it is entered here. Without this figure VERBRAUCH and LADEKWH are not produced. 0 means: not set."
H_KONTO = "Access to the Audi account"
H_LADEEMPF = "Charging recommendation from a foreign topic"
H_LADEEMPF_ALTER = "How old may the last value be and still count? After that no recommendation is produced — and no 0 either, because nobody said that charging is currently a bad idea."
H_LADEEMPF_GRENZE = "The threshold. Negative and fractional numbers are allowed — on the exchange electricity sometimes costs less than nothing."
H_LADEEMPF_THEMA = "The full MQTT topic the comparison value comes from. For example the current exchange price from one of the spot price plugins, or a PV surplus in watts. Allowed are letters, digits, dot, hyphen and underscore, levels separated by one slash – no wildcards + or #, exactly one value is needed."
H_LADEEMPF_UNTER = "Ticked: recommend when the value is <b>less than or equal to</b> the threshold (suitable for an electricity price). Unticked: recommend when it is <b>greater than or equal</b> (suitable for a PV surplus)."
H_MELDEN_EIN = "Additionally places faults in the LoxBerry notification area. A report is only made after three unsuccessful fetches in a row — a single fault at Audi is no reason to bother anyone."
H_MQTT_TOPIC = "Allowed are letters, digits, hyphen and underscore, levels separated by one slash (none at the start or end). All topics derive from the prefix, see the MQTT tab. The subscription file of the gateway follows it on saving."
H_NUR_MINISERVER = "The endpoint then only accepts calls from the addresses LoxBerry knows as Miniservers. If none is known the checkbox has no effect — an empty list would otherwise reject every access, including the legitimate one. Known addresses:"
H_PASSWORT = "If the field stays empty the stored password remains unchanged. It is never displayed — the Test tab only shows its length."
H_PROBE_EIN = "In a dry run every switching command is checked completely — permissions, limits, throttling, whether the vehicle offers the function at all — but <b>nothing is sent to the vehicle</b>. This lets you check the whole chain from Loxone to the queue without touching the car. Every answer then begins with the word PROBE."
H_SICHERUNG = "Back up and restore settings"
H_SPIN = "The four-digit S-PIN from the myAudi app. It is only needed for <b>locking and unlocking</b>; without it the connector rejects those two commands. If you do not need them, leave the field empty."
H_STEUERUNG = "Writing commands"
H_STROM_ABSTAND = "Shortest gap between two changes of the charging current. Important for surplus charging: a controller in Loxone delivers a new set point every few seconds, and each one would be a request to Audi. The same value is never sent twice anyway."
H_TAKT = "Fetch interval"
H_TAKT_WARTUNG = "Inspection and oil service change in days, not in minutes. With an interval of 300 seconds, 12 therefore means: once per hour."
H_TEMP = "Limits for the climatisation. A value outside is <b>rejected</b>, not clipped to the limit: a silently changed set point leads to a vehicle doing something other than what is displayed."
H_VERLAUF_TAGE = "How long the samples for the daily chart and the charging sessions are kept."
H_WARTEZEIT = "This is how long the web interface waits for the service to answer a command. After that it reports <span class='sm-mono'>OK=2</span> — queued, result unknown. No success is reported that nobody has verified. <b>Exception:</b> for climatisation, charging, waking and the intervening commands the interface waits at least 30 seconds even if less is set here — at Audi, waking a parked vehicle regularly takes twenty to forty-five seconds."
H_ZUGANG_LOESCHEN = "Deletes e-mail, password and S-PIN together with the authentication tokens of the library (<span class='sm-mono'>token.json</span>). What does <b>not</b> happen: a running service is not stopped, and a downloaded backup file stays where it is – it still carries the credentials."
KEINE_FAHRZEUGE = "No vehicle detected yet. This is normal until the first successful fetch: enter the credentials, save, start the service and wait one interval. If the list is still empty after that, the reason is in the Test tab and in the log file."
KEIN_MINISERVER = "no Miniserver configured in the LoxBerry settings"
KONTO_ERKLAERUNG = "These are the credentials of the <b>myAudi account</b> — the same ones you use in the myAudi app. Not those of a dealer portal. They are stored in a separate file with permissions 0600, not in the configuration this page displays. <b>Two notes:</b> the connector talks to the <b>European</b> service. And some accounts require two-factor confirmation, which cannot be automated. Whoever is affected signs in once in a browser on this device."
