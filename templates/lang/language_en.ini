[LOX]
BILD_ALT = "Plugin blocks in Loxone Config"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
EINGRIFF = "intervening"
EINLEITUNG = "Nine steps. Working through them from top to bottom yields a working integration — including the four pages from the sample project in step 8."
