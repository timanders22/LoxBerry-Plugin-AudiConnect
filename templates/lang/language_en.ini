; Audi Connect - English
;
; English is the FALLBACK language, not German: whoever has set a third
; language understands English more likely. This file must therefore always be
; complete - au_t() falls back to it for every key the chosen language lacks.
;
; Every value is enclosed in double quotes: with parse_ini_file a ';' starts a
; comment, and every HTML entity ends with a semicolon. No double quote may
; appear inside a value - quote HTML attributes single: <span class='sm-mono'>.

