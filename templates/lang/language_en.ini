PLATZHALTER = "<b>N</b> stands for the running number of the vehicle, so 1 for the first. Topics whose value is a string (plain texts, address, model) are at the end of the table."
THEMEN_ERKLAERUNG = "The column <i>retained</i> says whether the broker keeps the last value. That applies to the states of the vehicle – locking, doors, windows, charging, odometer and the others marked <i>yes</i> – so that Loxone has them right after a restart. Measured values tied to time, position, completion times and the statements of the service about itself are never retained. A state without a statement goes out as <span class='sm-mono'>-</span>; a measured value without a value is not sent at all — so no invented zero comes into being. <span class='sm-mono'>status/ts</span> and <span class='sm-mono'>status/zaehler</span> are the sign of life and come with every pass."
