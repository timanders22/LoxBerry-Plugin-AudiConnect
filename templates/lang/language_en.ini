HERKUNFT_UNBEKANNT = "unknown origin (%s)"
H_TITEL = "Loxone integration"
K_TOKEN_LESEN = "Roll a new read token"
K_TOKEN_SCHALTEN = "Roll a new switch token"
K_VORLAGE_N = "Template %s — vehicle %s"
K_VORLAGE_VO = "Template virtual output — vehicle %s"
MEHRERE_FAHRZEUGE = "Several vehicles in the account — one virtual input per vehicle:"
S1_TEXT = "There are two ways, and <b>MQTT is the standard one</b>. The gateway creates the names of the virtual inputs itself; in Loxone a suitably named virtual input is then enough. The HTTP route needs one command recognition per value, but everything arrives in <b>one</b> request and you can see in the browser straight away what comes in. Newcomers take MQTT; whoever needs only a few values gets there faster with HTTP. Both at once works too."
S1_TITEL = "Step 1: choose the route"
S2_TEXT = "Only needed if you take the MQTT route. Enter under <i>System → MQTT Gateway</i> in the section <i>Subscriptions</i>:"
S2_TITEL = "Step 2: enter the subscription in the MQTT gateway"
S2_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> This is by far the most common cause of failure — the plugin sends, but nobody listens."
S3_ADRESSE_ZEILE = "The location request returns a <b>second line</b> with the address in plain text. It is meant for a text display, not for a command recognition; the first line deliberately consists of numbers only."
S3_STRICH = "<b>A dash instead of a number means: this value is not available.</b> No 0 is sent on purpose — a 0 would be a silent false statement. Loxone then keeps the last valid value. That is exactly why the failure detection from step 7 is needed. Fields marked <i>stays empty</i> in the <i>origin</i> column are not supplied by the Audi connector at all — they are listed for completeness."
S3_TEXT = "In Loxone Config: <i>Virtual input → Virtual HTTP input</i>. One input per request. The button below each table creates the finished import file — that is less tedious and less error-prone than typing. The table still remains: it explains what is imported. The charging input stays empty on a pure combustion vehicle; there will be dashes everywhere, and that is correct."
S3_TITEL = "Step 3: create virtual HTTP inputs"
S4_TEXT = "Loxone handles numbers well, plain text not. The request <span class='sm-mono'>text</span> therefore returns one readable value per line: which state the vehicle reports, whether the climatisation heats or cools, <b>which</b> door is open, the address and the name of the charging station. For this, create a <i>virtual text input</i> in Loxone Config and one command recognition per line following the pattern <span class='sm-mono'>\iTUEREN=\i\t</span> — name, equals sign, rest of the line as text. Unlike the numeric lines there is <b>no</b> semicolon in front here: every value has its own line, and none of the eleven names is the tail of another."
S4_TITEL = "Step 4: plain texts for the app (virtual text input)"
S5_TEXT = "Only needed if Loxone is to trigger something. The button below creates a finished virtual output including all commands — up to 0.9.7 they had to be typed one by one, each line containing a 24-character token. In the command text <span class='sm-mono'>&lt;v&gt;</span> stands for the value passed. <b>Note: this uses the switch token</b>, not the read token."
S5_TITEL = "Step 5: sending commands (virtual output)"
S5_WARNUNG = "Three things to know beforehand. <b>First:</b> writing commands are blocked by default and must be released in the Settings tab first; locking and unlocking, horn and headlight flash additionally need the second checkbox and otherwise do not even appear in the template. <b>Second:</b> an answer of <span class='sm-mono'>OK=1</span> means the Audi server accepted the job with HTTP 200. Whether the vehicle carries it out only shows on the next fetch — if you want to be sure, evaluate the state read back, not the answer to the command. <b>Third:</b> the throttling rejects commands that come too close together. That is intentional and protects your account; the reason is in the answer."
S6_TEXT = "The endpoint sits in the unauthenticated area so that Loxone can reach it without credentials. It is protected by these two tokens. <b>Why two?</b> The read token appears in every address of a virtual input and therefore in every Loxone project file that is passed on. Up to 0.9.7 that very token could also start the climatisation. Switching calls now require the switch token; reading calls accept both. <b>A new token invalidates all affected addresses at a stroke</b> and has to be carried over everywhere. So only roll what has actually fallen into the wrong hands."
S6_TITEL = "Step 6: the two tokens"
S7_TEXT = "If the cloud goes silent, the virtual inputs keep their last value. In the app everything then looks normal although nothing has arrived for hours. That is why the value <span class='sm-mono'>ALTER</span> is carried along: it says how old the image is in seconds. Its threshold belongs <b>well above the fetch interval</b> — with a 300 second interval, 900 seconds is a usable value, so a single missed run does not raise an alarm. Since 0.9.8 there are additionally <span class='sm-mono'>FEHLFOLGE</span> (how many fetches failed in a row) and <span class='sm-mono'>GRUND</span> (why). This distinguishes a temporary fault at Audi from a blocked account without looking into the log file."
S7_TITEL = "Step 7: failure detection"
S8_ERLAEUTERUNG = "<p><b>On #13 to #16:</b> the message about an open vehicle runs through an OR and an on-delay. Both are intentional. The notification block only sends on a change from off to on; if several sources are attached directly to its input, one permanently active source swallows all the others. The five-minute delay prevents a message while you are loading the car.</p><p><b>On #17 and #18:</b> two separate threshold switches, because a vehicle supplies either a state of charge or a fuel level — with a hybrid, both. The value not supplied stays a dash; the corresponding switch then keeps its last state and does not switch.</p><p><b>On #21 and #22:</b> the notification block only sends on a change from off to on — which is exactly why it is right here: you get a message when the charging cable is plugged in, and not continuously while it is plugged in. For the opposite message, put a NOT in front.</p><p><b>On #23:</b> the inspection message needs the input from the maintenance request, not the one from the status request.</p><p><b>On #25:</b> the threshold for the failure detection is deliberately three times the fetch interval. Setting it tighter produces a message for every single missed run.</p><p><b>On #28 to #33:</b> pre-heating is optional. The weekly timer sets the desired departure time, the AND with presence prevents heating while you are on holiday, and the pulse generator makes sure the command is triggered once instead of being sent continuously. <b>If you use the plugin Abfahrtsassistent you do not need #28 to #33:</b> Audi Connect then handles the pre-conditioning itself, see the Settings tab. <b>Loxone time base:</b> seconds since 01.01.2009. If a time block delivers Unix time (values around 1.23 billion), subtract 1230768000.</p><p><b>On #34:</b> optional but useful: a command that switches the climatisation off again by hand. Without it, it runs until its own timeout.</p><p><b>On #35 to #39 — surplus or price charging:</b> ZUHAUSE comes from the home position configured in the Settings tab; LADEEMPF from the foreign MQTT topic configured there. Both stay empty as long as the respective ingredient is missing — the AND then does not switch, and that is correct. <b>Important:</b> the charging current is debounced; a controller sending new set points every second is rejected, and the reason is in the answer.</p><p><b>On #40 and #41:</b> FEHLFOLGE counts how many fetches failed in a row. Three in a row mean a quarter of an hour without a connection at a 300 second interval — that is the threshold at which reporting is worthwhile.</p><p><b>On #14 — why four sources hang on two inputs there:</b> with AND and OR the number of inputs is a property of the block that Loxone Config sets itself. If you pull up a third input, Config opens the file next time without any message, removes the input again — and deletes every connection that hung on it. What is allowed is attaching several sources to <i>one</i> input; they are OR-combined. On an OR that is the same result with two inputs. <b>On an AND it would be wrong</b>: there, several sources on one input are OR-combined as well, turning the AND into an OR without anything reporting it. On #30 and #38 exactly one source therefore hangs on each input.</p>"
S8_TEXT = "One block per line. Loxone Config lists them all in the block search (F5). Lines 1 to 12 and 35 to 37 are virtual inputs from step 3 — whoever loaded the templates will already find them in the tree."
S8_TITEL = "Step 8: complete block list for 1:1 rebuilding"
S9_TEXT = "Call these four addresses in a browser. The first must return values, the other three must be <b>rejected</b> — if not, something is wrong with the protection. The last one is the counter-check on the separation of the two tokens."
S9_TITEL = "Step 9: counter-check"
