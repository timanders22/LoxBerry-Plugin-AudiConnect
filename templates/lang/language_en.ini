H_TITEL = "Loxone integration"
K_TOKEN_LESEN = "Roll a new read token"
K_TOKEN_SCHALTEN = "Roll a new switch token"
K_VORLAGE_N = "Template %s — vehicle %s"
K_VORLAGE_VO = "Template virtual output — vehicle %s"
MEHRERE_FAHRZEUGE = "Several vehicles in the account — one virtual input per vehicle:"
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
S1_TEXT = "There are two ways. <b>The sample project and the pages in step 8 use HTTP</b>: there are ready-made import templates for all four requests and for the commands, and you can see in the browser straight away what comes in. MQTT is the second way (off by default): the gateway creates the names of the virtual inputs itself and additionally delivers the plain texts from step 4. Both ways at once work, but deliver the same values twice."
S1_TITEL = "Step 1: choose the route"
S2_TEXT = "Only needed if you take the MQTT route. The topic group of this plugin is:"
S2_TITEL = "Step 2: the subscription in the MQTT gateway"
S3_ADRESSE_ZEILE = "The location request returns a <b>second line</b> with the address in plain text. It is meant for a text display, not for a command recognition; the first line deliberately consists of numbers only."
S3_STRICH = "<b>A dash instead of a number means: this value is not available.</b> No 0 is sent on purpose — a 0 would be a silent false statement. Loxone then keeps the last valid value. That is exactly why the failure detection from step 7 is needed. Fields marked <i>stays empty</i> in the <i>origin</i> column are not supplied by the Audi connector at all — they are listed for completeness."
S3_TEXT = "In Loxone Config: <i>Virtual input → Virtual HTTP input</i>. One input per request. The button below each table creates the finished import file — that is less tedious and less error-prone than typing. The table still remains: it explains what is imported. The charging input stays empty on a pure combustion vehicle; there will be dashes everywhere, and that is correct."
S3_TITEL = "Step 3: create virtual HTTP inputs"
S4_TEXT = "Loxone handles numbers well, plain text not. The plain texts – which state the vehicle reports, whether the climatisation heats or cools, <b>which</b> door is open, the address and the name of the charging station – come via MQTT: with MQTT switched on, the MQTT gateway creates virtual text inputs for them, such as <span class='sm-mono'>audi_fahrzeug1_tueren_namen</span> (prefix audi); keep the title exactly like that. A virtual text input does not poll anything itself and has no command recognition – the request <span class='sm-mono'>text</span> below is therefore meant for viewing in the browser. The pages in step 8 show the same without MQTT through status blocks built from the numbers."
S4_TITEL = "Step 4: plain texts for the app (via MQTT)"
S5_TEXT = "Only needed if Loxone is to trigger something. The button below creates a finished virtual output including all commands — up to 0.9.7 they had to be typed one by one, each line containing a 24-character token. In the command text <span class='sm-mono'>&lt;v.1&gt;</span> stands for a temperature with one decimal and <span class='sm-mono'>&lt;v.0&gt;</span> for a whole number (charge limit, charging current). The command titles are fixed German, also with an English interface; the climatisation starts with the temperature and is switched off with its own command “Klimatisierung aus”. If you imported the template before version 0.9.28, import it again. <b>Note: this uses the switch token</b>, not the read token."
S5_TITEL = "Step 5: sending commands (virtual output)"
S5_WARNUNG = "Three things to know beforehand. <b>First:</b> writing commands are blocked by default and must be released in the Settings tab first; locking and unlocking, horn and headlight flash additionally need the second checkbox and otherwise do not even appear in the template. <b>Second:</b> an answer of <span class='sm-mono'>OK=1</span> means the Audi server accepted the job with HTTP 200. Whether the vehicle carries it out only shows on the next fetch — if you want to be sure, evaluate the state read back, not the answer to the command. <b>Third:</b> the throttling rejects commands that come too close together. That is intentional and protects your account; the reason is in the answer."
S6_TEXT = "The endpoint sits in the unauthenticated area so that Loxone can reach it without credentials. It is protected by these two tokens. <b>Why two?</b> The read token appears in every address of a virtual input and therefore in every Loxone project file that is passed on. Up to 0.9.7 that very token could also start the climatisation. Switching calls now require the switch token; reading calls accept both. <b>A new token invalidates all affected addresses at a stroke</b> and has to be carried over everywhere. So only roll what has actually fallen into the wrong hands."
S6_TITEL = "Step 6: the two tokens"
S7_TEXT = "If the cloud goes silent, the virtual inputs keep their last value. In the app everything then looks normal although nothing has arrived for hours. That is why the value <span class='sm-mono'>ALTER</span> is carried along: it says how old the image is in seconds. <span class='sm-mono'>OK</span> drops to 0 as soon as the image is older than three fetch intervals. If the LoxBerry itself stands still, however, OK and ALTER freeze as well – only a Value Validator on the age notices that (Tmc 900 seconds with a 300 second interval; page “AudiConnect” in step 8). Both go through an OR into one message. Since 0.9.8 there are additionally <span class='sm-mono'>FEHLFOLGE</span> (how many fetches failed in a row) and <span class='sm-mono'>GRUND</span> (why). This distinguishes a temporary fault at Audi from a blocked account without looking into the log file."
S7_TITEL = "Step 7: failure detection"
S8_TEXT = "Four pages from the LoxBerry plugins sample project, built and connected there in Loxone Config. One block per row; Loxone Config lists them all in the block search (key F5), the commands of the templates from steps 3 and 5 are in the tree after importing. If you only want monitoring, take over the first page alone. The names apply to the vehicle with the lowest number, as the templates create them; the command titles are fixed German, also with an English interface."
S8_TITEL = "Step 8: four pages from the sample project to rebuild"
S9_TEXT = "Call these four addresses in a browser. The first must return values, the other three must be <b>rejected</b> — if not, something is wrong with the protection. The last one is the counter-check on the separation of the two tokens."
S9_TITEL = "Step 9: counter-check"
TOKEN_ART_UNBEKANNT = "No token was created: the request did not name one of the three permitted kinds (read, switch, both)."
TOKEN_NEU = "A new token has been created. All addresses entered in the Miniserver so far that contain it are now invalid and must be carried over."
