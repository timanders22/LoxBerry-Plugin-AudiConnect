[EINST]
ABFAHRT_ERKLAERUNG = "If the plugin <i>Abfahrtsassistent</i> runs on this LoxBerry, Audi Connect can start the climatisation by itself — as many minutes before departure as set below. The assistant publishes the remaining minutes over MQTT; this plugin listens in. <b>Off by default.</b> It needs the Python module paho-mqtt in the virtual environment — the installation fetches it when there is an internet connection."
ANSAGE_ERKLAERUNG = "The plugin can announce single events – through the Loxone Music Server, MusicServer4Home, an own address template, Alexa-NG or Google speakers (Chromecast 4 Lox NG). The output is <b>off</b> by default. Only a change is announced, never a value on every poll; the same event is announced for the same vehicle at most once per hour, and after a restart of the service the first poll never speaks. MQTT, Loxone and notifications are not affected. Address and template must be in the home network."
DIENST_ERKLAERUNG = "The service fetches the values from the Audi interface at the configured interval and stores them. The web interface and the Miniserver only read what has been stored — they never talk to the provider themselves."
DIENST_OHNE_ZUGANG = "The service was not started: no credentials are stored yet. Please enter the e-mail address and password of the myAudi account above, save, and then start the service."
