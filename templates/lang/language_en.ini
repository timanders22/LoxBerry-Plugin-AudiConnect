[LOX]
EINGRIFF = "intervening"
EINLEITUNG = "Nine steps. Working through them from top to bottom yields a working integration — including the complete block list in step 8."
EP_LADEN = "Charging values"
EP_POSITION = "Location"
EP_STATUS = "Main values"
EP_WARTUNG = "Maintenance"
HERKUNFT_BESTAND = "from the cache"
HERKUNFT_CONNECTOR = "from the vehicle"
