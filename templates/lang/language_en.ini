DIENST_START = "Service started:"
DIENST_STOP = "Service stopped:"
DIENST_UPGRADE_LAEUFT = "The service was not started: an update of this plugin is currently running. It starts the service itself when it finishes. The Test tab shows how long the update has been running."
DROSSEL_ERKLAERUNG = "<b>These three values protect your myAudi account.</b> Audi throttles an account that sends too many requests and, in the worst case, blocks it for 24 hours. A flapping block in Loxone — a pulse generator on the wrong input is enough — could otherwise trigger a fetch or a command every single second. Rejected commands are answered with an explicit reason instead of being silently dropped: whoever is not told that a command was not carried out will press again."
FEHLER_BEREICH = "%s: the value must be between %d and %d."
FEHLER_EMAIL = "The user name does not look like an e-mail address."
FEHLER_EMAIL_LEER = "The e-mail field is empty, but a myAudi account is stored. An empty field no longer silently keeps the account: please enter the e-mail again – or use the button „Delete credentials“ to remove it."
FEHLER_HEIM_HALB = "The home position needs latitude <b>and</b> longitude. With only one of the two there is no point, and the value ZUHAUSE would stay empty forever."
FEHLER_PRAEFIX = "The departure assistant prefix is invalid. Allowed are letters, digits, hyphen and underscore, levels separated by one slash – no slash at the start or end and no empty level."
FEHLER_SPEICHERN = "The configuration could not be written: %s"
FEHLER_SPIN = "The S-PIN consists of exactly four digits. The value entered does not match this pattern and was not saved."
FEHLER_TEMP_TAUSCH = "The lowest target temperature is higher than the highest. Please swap the two values."
FEHLER_THEMA = "The topic for the charging recommendation is invalid. Allowed are letters, digits, dot, hyphen and underscore, levels separated by one slash – no slash at the start or end, no empty level and no wildcards + or #."
FEHLER_THEMA_LEER = "The charging recommendation is switched on but no topic is given. Without a topic no value is ever produced."
FEHLER_TOPIC = "The topic prefix is invalid. Allowed are letters, digits, hyphen and underscore, levels separated by one slash – no slash at the start or end, no empty level, at most 64 characters. Nothing is corrected silently."
FEHLER_ZAHL = "%s: please enter a whole number."
FEHLER_ZUGANG_SPEICHERN = "The credentials file could not be written. Check the permissions of the configuration folder."
GEFAHR_ERKLAERUNG = "<b>Locking and unlocking, horn and headlight flash are blocked once more, separately.</b> They act on a vehicle standing in a public place: an accidental unlock leaves it open without anyone noticing, and a horn at three in the morning wakes the neighbourhood. The general control checkbox above is not enough — this second one is required as well. <b>Locking and unlocking also requires the S-PIN</b>, otherwise the connector rejects the command. Neither has been tried on an actual vehicle."
GERECHNET_ERKLAERUNG = "These figures are in no vehicle — the plugin computes further values from them. <b>If an ingredient is missing, no value is produced</b>, and certainly not a 0: a 0 would be a statement nobody made."
GESPEICHERT = "The settings have been saved."
HORCHER_AUS = "not connected to the broker"
HORCHER_ZUSTAND = "State of the listener:"
H_ABFAHRT = "Pre-conditioning via the departure assistant"
H_ABFAHRT_ALTER = "How old may the assistant's last message be and still count? After that nothing is triggered — a silent plugin must not lead to heating for no reason at some point."
H_ABFAHRT_FAHRZEUG = "With several vehicles in the account: which one shall be pre-conditioned?"
H_ABFAHRT_PRAEFIX = "The same prefix that is configured in the departure assistant. <span class='sm-mono'>abfahrt</span> by default. Subscribed from it are <span class='sm-mono'>…/ABFAHRT_IN</span> and <span class='sm-mono'>…/OK</span>."
H_ABFAHRT_VORLAUF = "This many minutes before departure the climatisation is started. It is triggered at most once per departure."
H_ABRUF_ABSTAND = "Shortest gap between two immediate fetches. Every fetch wakes the vehicle and costs standby power. 0 disables the brake — not recommended."
H_ANSAGE = "Speech output (announcements, off by default)"
H_ANSAGE_ANLAESSE = "Events"
H_ANSAGE_ANLAESSE_HILFE = "Each event can be deselected; it only takes effect once an output is chosen above. The test announcement is on the <i>Test</i> tab."
H_BEFEHLE_STUNDE = "Maximum number of switching commands per hour. Once reached, further ones are rejected until there is room again. 0 means: no limit."
H_DATENSCHUTZ = "Privacy and access"
