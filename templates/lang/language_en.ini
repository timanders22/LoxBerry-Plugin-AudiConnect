TAKT_WARNUNG = "<b>Lower limit 180 seconds.</b> The Audi connector accepts nothing below that — it throws an error on creation. And above it too: too frequent requests are rejected by Audi with HTTP 429, and a constantly woken car costs standby power. Five minutes are a good start. If a value is needed immediately, the fetch command is the right way, not a shorter interval."
