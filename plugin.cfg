[AUTHOR]
# Autorenname, E-Mail und Plugin-Name bilden zusammen den MD5-Schluessel in
# der plugindatabase.json. Nach der ersten Veroeffentlichung NIE mehr aendern -
# LoxBerry erkennt das Plugin sonst nicht wieder und Updates schlagen fehl.
NAME=Audi Connect Plugin Authors
EMAIL=audiconnect@users.noreply.github.com

[PLUGIN]
VERSION=0.9.8
NAME=audiconnect
FOLDER=audiconnect
TITLE=Audi Connect

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository.
#
# Hier steht die Nummer der VORLIEGENDEN Fassung (0.9.8). Die beiden .cfg im
# Wurzelverzeichnis stehen weiterhin auf der zuletzt VEROEFFENTLICHTEN (0.9.6)
# und werden erst hochgezogen, wenn der zugehoerige Tag auf GitHub wirklich
# antwortet - stehen sie zu frueh auf der neuen Nummer, bieten sie jeder
# Anlage eine Fassung an, die es als Tag noch nicht gibt, und keine kann sie
# laden. Beides ist stumm; deshalb setzt Werkzeuge/fassung_setzen.py die
# beiden .cfg nur mit --auch-release und nur nach einer Messung am Tag.
#
# BERICHTIGT am 20.08.2026: hier stand bis 0.9.7 "Die Fassung steht bewusst
# auf 0.9.1". Das war schon damals nicht mehr wahr - ein stehengebliebener
# Text ueber die eigene Fassungsnummer ist genau die Art von Widerspruch, die
# man beim Suchen nie findet, weil man dem Kommentar glaubt.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AudiConnect/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AudiConnect/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist das MQTT-Gateway Bestandteil des Systems. Mit dieser
# Untergrenze darf die Fallunterscheidung im Code entfallen.
LB_MINIMUM=3.0.0
# Keine Obergrenze: plugininstall.pl bricht bei Ueberschreitung ab, statt nur
# zu warnen. Eine Obergrenze braucht einen belegten Grund - hier gibt es keinen.
LB_MAXIMUM=false
ARCHITECTURE=false
