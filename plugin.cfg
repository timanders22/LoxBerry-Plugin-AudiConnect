[AUTHOR]
# Autorenname, E-Mail und Plugin-Name bilden zusammen den MD5-Schluessel in
# der plugindatabase.json. Nach der ersten Veroeffentlichung NIE mehr aendern -
# LoxBerry erkennt das Plugin sonst nicht wieder und Updates schlagen fehl.
NAME=Audi Connect Plugin Authors
EMAIL=audiconnect@users.noreply.github.com

[PLUGIN]
VERSION=0.9.13
NAME=audiconnect
FOLDER=audiconnect
TITLE=Audi Connect

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository.
#
# Hier steht die Nummer der VORLIEGENDEN Fassung - die, die in diesem Ordner
# steckt. Die beiden .cfg im Wurzelverzeichnis stehen auf der zuletzt
# VEROEFFENTLICHTEN und werden erst hochgezogen, wenn der zugehoerige Tag auf
# GitHub wirklich antwortet - stehen sie zu frueh auf der neuen Nummer, bieten
# sie jeder Anlage eine Fassung an, die es als Tag noch nicht gibt, und keine
# kann sie laden. Beides ist stumm; deshalb setzt Werkzeuge/fassung_setzen.py
# die beiden .cfg nur mit --auch-release und nur nach einer Messung am Tag.
#
# HIER STEHT KEINE NUMMER MEHR, und das ist der Punkt. Dieser Text hat
# zweimal Fassungen genannt, die es zum Zeitpunkt des Lesens nicht mehr
# gab - beim zweiten Mal als ausdrueckliche Berichtigung des ersten Falls,
# und danach stand er drei Fassungen lang wieder falsch da. Kein Werkzeug
# der Pruefkette sieht in die Kommentare einer .cfg; ein Text ueber die
# eigene Fassungsnummer altert deshalb schweigend, und wer ihn liest,
# glaubt ihm. Ein Kommentar beschreibt das VERFAHREN. Die Nummer steht
# unten in VERSION, und nur dort.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AudiConnect/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AudiConnect/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist das MQTT-Gateway Bestandteil des Systems. Mit dieser
# Untergrenze darf die Fallunterscheidung im Code entfallen.
LB_MINIMUM=3.0.0
# Keine Obergrenze: plugininstall.pl bricht bei Ueberschreitung ab, statt nur
# zu warnen. Eine Obergrenze braucht einen belegten Grund - hier gibt es keinen.
LB_MAXIMUM=false
ARCHITECTURE=false
