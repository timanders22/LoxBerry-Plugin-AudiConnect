[AUTHOR]
# Autorenname, E-Mail und Plugin-Name bilden zusammen den MD5-Schluessel in
# der plugindatabase.json. Nach der ersten Veroeffentlichung NIE mehr aendern -
# LoxBerry erkennt das Plugin sonst nicht wieder und Updates schlagen fehl.
NAME=Audi Connect Plugin Authors
EMAIL=audiconnect@users.noreply.github.com

[PLUGIN]
VERSION=0.9.6
NAME=audiconnect
FOLDER=audiconnect
TITLE=Audi Connect

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository.
#
# Die Fassung steht bewusst auf 0.9.1: solange nichts an einem echten Konto und
# Fahrzeug erprobt ist, wird niemandem ein Update angeboten (0.9.1 = 0.9.1).
# Sobald 1.0.0 erscheint, greift die Aktualisierung von selbst.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AudiConnect/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AudiConnect/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist das MQTT-Gateway Bestandteil des Systems. Mit dieser
# Untergrenze darf die Fallunterscheidung im Code entfallen.
LB_MINIMUM=3.0.0
# Keine Obergrenze: plugininstall.pl bricht bei Ueberschreitung ab, statt nur
# zu warnen. Eine Obergrenze braucht einen belegten Grund - hier gibt es keinen.
LB_MAXIMUM=false
ARCHITECTURE=false
