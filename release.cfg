[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# das Auto-Update. Die Adressen zeigen auf das EIGENE Repository und auf den
# Tag, dessen Nummer unten in VERSION steht.
#
# HIER STAND EINE TAG-NUMMER, und sie hinkte den Adressen darunter um
# mehrere Fassungen hinterher. Der Widerspruch war ausgerechnet mit dem
# naheliegenden Suchmuster unsichtbar: die alte Nummer war ein Vorsatz der
# neuen, eine Suche nach ihr fand beide Zeilen und meldete
# Uebereinstimmung. Deshalb nennt dieser Kommentar keine Nummer mehr - sie
# steht unten in VERSION und in den beiden Adressen, und dort haelt sie
# Werkzeuge/fassung_setzen.py zusammen.
#
# Bei jedem weiteren Release: VERSION hier UND in der plugin.cfg gemeinsam
# hochziehen, beide Adressen auf den neuen Tag setzen, das GitHub-Release mit
# genau diesem Tag anlegen - und danach nachpruefen:
#   Tag:     .../git/ref/tags/<Tag>
#   Release: .../releases
#   Archiv:  gegen eine erfundene Fassung gegentesten (die echte laedt
#            herunter, die erfundene zeigt "404: Not Found")
# Die prerelease.cfg mitziehen.

VERSION=0.9.19
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-AudiConnect/archive/refs/tags/v0.9.19.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-AudiConnect/releases/tag/v0.9.19
